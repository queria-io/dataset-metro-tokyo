      - key: municipality_code
        source: ["全国地方公共団体コード", "都道府県コード又は市区町村コード", "市区町村コード"]
      - key: facility_id
        source: ["ID", "NO"]
      - key: name
        source: ["名称"]
      - key: name_kana
        source: ["名称_カナ"]
      - key: address
        source: ["所在地_連結表記", "住所"]
      - key: prefecture
