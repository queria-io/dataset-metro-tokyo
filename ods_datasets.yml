      - key: for_flood
        source: ["災害種別_洪水"]
      - key: for_landslide
        source: ["災害種別_崖崩れ、土石流及び地滑り", "災害種別_崖崩れ・土石流及び地滑り"]
      - key: for_storm_surge
        source: ["災害種別_高潮"]
      - key: for_earthquake
        source: ["災害種別_地震", "災害種別_地震(火災)"]
      - key: for_tsunami
        source: ["災害種別_津波"]
      - key: for_large_fire
