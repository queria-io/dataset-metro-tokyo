version: 2

models:
  - name: private_contracts
    access: public
    data_tests:
      - unique_key:
          arguments:
            columns: [org_code, category, period_label, seq_no]
    columns:
      - name: org_code
        data_tests: [not_null]
      - name: title
        data_tests: [not_null]
      - name: contract_date
        data_tests: [not_null]
  - name: planned_works
    access: public
    columns:
      - name: title
        data_tests: [not_null]
  - name: planned_goods
    access: public
    columns:
      - name: title
        data_tests: [not_null]
  - name: procurement_source_files
    access: public
