schema: hokenjo
name: food_establishment
title: 食品関係営業台帳
description: |-
  東京都保健医療局「食品関係営業台帳」の食品衛生法の営業許可・届出の一覧です。1 行が 1 施設・1 つの営業の種類です。

  - 東京都が設置する保健所の管轄（八王子市・町田市を除く多摩地域と島しょ）だけで、23 区・八王子市・町田市は含みません
  - 1 つの施設が複数の行に分かれます。施設の数は `count(DISTINCT (name, address))` で数えてください
  - 位置は所在地から Queria が求めたものです
keywords:
  - 東京都
  - 食品衛生
  - 営業許可
  - 飲食店
  - 施設
  - GIS
published: true
themes: [commerce_services, social_security_health]
sources:
  - path: https://www.hokeniryo.metro.tokyo.lg.jp/kenkou/hokenjo_daicho/shokuhineigyokyokadaicho
fields:
  - name: source_as_of
    title: 台帳の時点
    description: 配布ページが示す「○年○月○日現在」
  - name: permit_type
    title: 区分
    description: 許可 または 届出。食品衛生法の改正で、2021年6月以降に届出だけで足りる業種がある
  - name: name
    title: 屋号
  - name: address
    title: 営業所所在地
  - name: business_type
    title: 営業の種類
    description: 飲食店営業(一般飲食店)・菓子製造業(パン製造業) のように、業種と細分を括弧で併記する
  - name: application_type
    title: 申請区分
    description: 新規 / 継続 など。届出の行は空
  - name: phone_number
    title: 営業所電話番号
  - name: permit_date
    title: 許可日
    description: 許可は初回許可日、届出は届出年月日
  - name: operator_name
    title: 営業者氏名
  - name: operator_address
    title: 営業者住所
  - name: operator_phone_number
    title: 営業者電話番号
  - name: representative_name
    title: 法人代表者氏名
  - name: city_code
    title: 市区町村コード
    description: 所在地から求めた 5 桁の市区町村コード
    semantic: { role: entity, name: city }
  - name: geo_lat
    title: 緯度
    description: 所在地から求めた十進度（JGD2011）
  - name: geo_lon
    title: 経度
    description: 所在地から求めた十進度（JGD2011）
  - name: geo_source
    title: 座標の由来
    description: abr（所在地から求めた）または空
  - name: geo_level
    title: 座標の粒度
    description: 座標の粒度。原典由来は source、住所から求めたものは町字〜住居番号
  - name: geometry
    title: ジオメトリ
    description: geo_lat / geo_lon の POINT。座標が無い行は NULL
