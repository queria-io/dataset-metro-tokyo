version: 2

models:
  - name: food_establishment
    access: public
    data_tests:
      - abr_geo_consistent
      - ods_geocode_coverage
    columns:
      - name: source_as_of
      - name: permit_type
      - name: name
      - name: address
      - name: business_type
      - name: application_type
      - name: phone_number
      - name: permit_date
      - name: operator_name
      - name: operator_address
      - name: operator_phone_number
      - name: representative_name
      - name: city_code
      - name: geo_lat
      - name: geo_lon
      - name: geo_source
      - name: geo_level
      - name: geometry

  - name: sanitation_facility
    access: public
    data_tests:
      - abr_geo_consistent
      - ods_geocode_coverage
    columns:
      - name: source_as_of
      - name: facility_type
      - name: permit_number
      - name: business_form
      - name: name
      - name: address
      - name: building
      - name: phone_number
      - name: permit_date
      - name: operator_name
      - name: operator_address
      - name: operator_building
      - name: operator_phone_number
      - name: representative_name
      - name: city_code
      - name: geo_lat
      - name: geo_lon
      - name: geo_source
      - name: geo_level
      - name: geometry
