schema: childcare
name: children_center
title: 児童館
description: |-
  東京都福祉局「社会福祉施設等一覧」の都内の児童館の一覧です。施設名・設置主体・所在地・位置を持ちます。

  - 年 2 回（5 月時点・10 月時点）更新される一覧の最新のものを取り込みます（`source_edition`）
  - 定員は原典がすべて「-」なので、全行 NULL です
keywords:
  - 東京都
  - 子育て
  - 児童館
  - 施設
  - GIS
published: true
themes: [social_security_health]
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/organization/t000054
fields:
  - name: source_edition
    title: 取込時点
    description: 取り込んだ「社会福祉施設等一覧」の時点（YYYY-MM）
  - name: establisher_type
    title: 設置
    description: 設置主体の区分（区市町村立・私立等）
  - name: name
    title: 施設名
  - name: postal_code
    title: 郵便番号
    semantic: { role: entity, name: postal_code }
  - name: address
    title: 所在地
    description: 都道府県名を含まない所在地（「千代田区外神田…」形式）
  - name: lon
    title: 経度
    description: 十進度（JGD2011）
  - name: lat
    title: 緯度
    description: 十進度（JGD2011）
  - name: crs
    title: 座標系
    description: 元データに記載された座標系（JGD2011）
  - name: geo_lat
    title: 緯度（地図表示用）
    description: Queria が付与した緯度。原典の値か住所から求めた値。由来は geo_source
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: source=原典 / source_swapped=緯度経度を入れ替え / abr=住所から / NULL=なし
  - name: geo_level
    title: 座標の粒度
    description: 座標の粒度。原典由来は source、住所から求めたものは町字〜住居番号
  - name: geometry
    title: ジオメトリ
    description: geo_lat / geo_lon の POINT。座標が無い行は NULL
  - name: phone_number
    title: 電話番号
  - name: capacity
    title: 定員
    description: 定員（人）。原典の「-」や空欄は NULL
