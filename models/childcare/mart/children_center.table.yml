schema: childcare
name: children_center
title: 児童館
description: '東京都内の児童館の一覧（ポイント）。設置主体・施設名・所在地・緯度経度・

  定員を持つ。東京都福祉局「社会福祉施設等一覧」。一覧は年2回（5月時点・10月時点）

  更新され、常に最新版を取り込む。どの時点かは source_edition を見る。

  座標系は JGD2011。所在地は都道府県名を含まない（「千代田区外神田…」形式）。'
keywords:
  - 東京都
  - 子育て
  - 児童館
  - 施設
  - GIS
published: true
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/organization/t000054
fields:
  - name: source_edition
    title: 取込時点
    description: 取り込んだ「社会福祉施設等一覧」の時点（YYYY-MM）
  - name: establisher_type
    title: 設置
    description: 設置主体の区分（区市町村立・私立等）
  - name: name
    title: 施設名
  - name: postal_code
    title: 郵便番号
  - name: address
    title: 所在地
    description: 都道府県名を含まない所在地（「千代田区外神田…」形式）
  - name: lon
    title: 経度
    description: 十進度（JGD2011）
  - name: lat
    title: 緯度
    description: 十進度（JGD2011）
  - name: crs
    title: 座標系
    description: 元データに記載された座標系（JGD2011）
  - name: geo_lat
    title: 緯度（地図表示用）
    description: 'Queria が付与。原典の緯度経度が日本の値域に収まればその値、緯度と経度が

      入れ替わっていれば入れ替えた値。採用できなければ NULL。由来は geo_source を見る'
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: 'source=原典の緯度経度をそのまま採用、source_swapped=原典で緯度と経度が

      入れ替わっていたので入れ替えて採用、NULL=採用できる座標が無い'
  - name: geo_level
    title: 座標の粒度
    description: 原典由来の座標なので source。採用できる座標が無い行は NULL。語彙は ods スキーマと揃えてある
  - name: geometry
    title: ジオメトリ
    description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
  - name: phone_number
    title: 電話番号
  - name: capacity
    title: 定員
    description: 定員（人）。元データの '-' や空欄は NULL。元データは全施設が '-' で公開されており全行 NULL（2025-10 版時点）
