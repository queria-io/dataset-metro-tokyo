schema: childcare
name: children_center
title: 児童館
description: '東京都内の児童館の一覧（ポイント）。設置主体・施設名・所在地・緯度経度・

  定員を持つ。東京都福祉局「社会福祉施設等一覧」。一覧は年2回（5月時点・10月時点）

  更新され、常に最新版を取り込む。どの時点かは source_edition を見る。

  座標系は JGD2011。所在地は都道府県名を含まない（「千代田区外神田…」形式）。'
keywords:
  - 東京都
  - 子育て
  - 児童館
  - 施設
  - GIS
published: true
