schema: childcare
name: nursery_school
title: 認可保育所
description: '東京都内の認可保育所の一覧（ポイント）。設置主体・施設名・所在地・緯度経度・

  認可定員を持つ。東京都福祉局「社会福祉施設等一覧（令和7年5月1日時点）」。

  座標系は JGD2011。所在地は都道府県名を含まない（「千代田区外神田…」形式）。'
keywords:
  - 東京都
  - 子育て
  - 保育所
  - 施設
  - GIS
published: true
sources:
  - path: https://www.opendata.metro.tokyo.lg.jp/fukushi/202505-2-1-hoikusyo.csv
fields:
  - name: establisher_type
    title: 設置
    description: 設置主体の区分（区市町村立・私立等）
  - name: name
    title: 施設名
  - name: postal_code
    title: 郵便番号
  - name: address
    title: 所在地
    description: 都道府県名を含まない所在地（「千代田区外神田…」形式）
  - name: lon
    title: 経度
    description: 十進度（JGD2011）
  - name: lat
    title: 緯度
    description: 十進度（JGD2011）
  - name: crs
    title: 座標系
    description: 元データに記載された座標系（JGD2011）
  - name: phone_number
    title: 電話番号
  - name: capacity
    title: 認可定員
    description: 認可定員（人）。元データの '-' や空欄は NULL
