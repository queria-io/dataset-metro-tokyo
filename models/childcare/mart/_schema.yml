version: 2

_meta: &meta
  source_url: "https://catalog.data.metro.tokyo.lg.jp/"
  published: true
  tags: ["東京都", "子育て", "施設", "GIS"]

models:
  - name: nursery_school
    description: |
      東京都内の認可保育所の一覧（ポイント）。設置主体・施設名・所在地・緯度経度・
      認可定員を持つ。東京都福祉局「社会福祉施設等一覧（令和7年5月1日時点）」。
      座標系は JGD2011。所在地は都道府県名を含まない（「千代田区外神田…」形式）。
    access: public
    config:
      meta:
        <<: *meta
        source_url: "https://www.opendata.metro.tokyo.lg.jp/fukushi/202505-2-1-hoikusyo.csv"
        tags: ["東京都", "子育て", "保育所", "施設", "GIS"]
        title: "認可保育所"
    columns:
      - name: establisher_type
        meta:
          title: 設置
          description: 設置主体の区分（区市町村立・私立等）
      - name: name
        meta:
          title: 施設名
      - name: postal_code
        meta:
          title: 郵便番号
      - name: address
        meta:
          title: 所在地
          description: 都道府県名を含まない所在地（「千代田区外神田…」形式）
      - name: lon
        meta:
          title: 経度
          description: 十進度（JGD2011）
      - name: lat
        meta:
          title: 緯度
          description: 十進度（JGD2011）
      - name: crs
        meta:
          title: 座標系
          description: 元データに記載された座標系（JGD2011）
      - name: phone_number
        meta:
          title: 電話番号
      - name: capacity
        meta:
          title: 認可定員
          description: 認可定員（人）。元データの '-' や空欄は NULL

  - name: children_center
    description: |
      東京都内の児童館の一覧（ポイント）。設置主体・施設名・所在地・緯度経度・
      定員を持つ。東京都福祉局「社会福祉施設等一覧（令和7年5月1日時点）」。
      座標系は JGD2011。所在地は都道府県名を含まない（「千代田区外神田…」形式）。
    access: public
    config:
      meta:
        <<: *meta
        source_url: "https://www.opendata.metro.tokyo.lg.jp/fukushi/202505-2-2_06-zidoukan.csv"
        tags: ["東京都", "子育て", "児童館", "施設", "GIS"]
        title: "児童館"
    columns:
      - name: establisher_type
        meta:
          title: 設置
          description: 設置主体の区分（区市町村立・私立等）
      - name: name
        meta:
          title: 施設名
      - name: postal_code
        meta:
          title: 郵便番号
      - name: address
        meta:
          title: 所在地
          description: 都道府県名を含まない所在地（「千代田区外神田…」形式）
      - name: lon
        meta:
          title: 経度
          description: 十進度（JGD2011）
      - name: lat
        meta:
          title: 緯度
          description: 十進度（JGD2011）
      - name: crs
        meta:
          title: 座標系
          description: 元データに記載された座標系（JGD2011）
      - name: phone_number
        meta:
          title: 電話番号
      - name: capacity
        meta:
          title: 定員
          description: 定員（人）。元データの '-' や空欄は NULL。令和7年5月版では全施設が '-' のため全行 NULL
