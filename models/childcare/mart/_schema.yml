version: 2

models:
  - name: nursery_school
    access: public
    data_tests:
      - ods_geo_consistent
      - ods_geo_coverage
    columns:
      - name: source_edition
      - name: establisher_type
      - name: name
      - name: postal_code
      - name: address
      - name: lon
      - name: lat
      - name: crs
      - name: geo_lat
      - name: geo_lon
      - name: geo_source
      - name: geo_level
      - name: geometry
      - name: phone_number
      - name: capacity

  - name: children_center
    access: public
    data_tests:
      - ods_geo_consistent
      - ods_geo_coverage
    columns:
      - name: source_edition
      - name: establisher_type
      - name: name
      - name: postal_code
      - name: address
      - name: lon
      - name: lat
      - name: crs
      - name: geo_lat
      - name: geo_lon
      - name: geo_source
      - name: geo_level
      - name: geometry
      - name: phone_number
      - name: capacity
