schema: ods
name: polling_place
title: 投票所
description: |-
  都内の区市町村が公開する「投票所一覧」（自治体標準オープンデータセット）を統合したものです。期日前投票所を含み、`polling_place_type` で区別します。

  - 公開している自治体は一部だけです。どの自治体のファイルを収録したかは `ods.source_files` にあります
  - 地図に表示するときは、Queria が付与した `geo_lat`・`geo_lon` を使ってください（由来は `geo_source`）
  - 住所や位置の無い自治体も多くあります
keywords:
  - 東京都
  - 選挙
  - 投票所
  - 自治体標準オープンデータセット
  - GIS
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: organization_name
    title: 地方公共団体名
  - name: facility_id
    title: 施設ID
  - name: polling_place_id
    title: 投票所ID
  - name: voting_district_number
    title: 投票区番号
  - name: name
    title: 名称
    description: 投票所（期日前投票所）の名称
  - name: name_kana
    title: 名称カナ
  - name: name_en
    title: 名称英字
  - name: description
    title: 説明
  - name: address
    title: 所在地
  - name: prefecture
    title: 都道府県
  - name: city
    title: 市区町村
  - name: ward
    title: 行政区
  - name: town
    title: 町字
  - name: town_id
    title: 町字ID
  - name: street_number
    title: 番地以下
  - name: building_name
    title: 建物名等（方書）
  - name: postal_code
    title: 郵便番号
    annotations: { queria: { semantic: { role: entity, name: postal_code } } }
  - name: phone_number
    title: 電話番号
  - name: lat
    title: 緯度
  - name: lon
    title: 経度
  - name: geo_lat
    title: 緯度（地図表示用）
    description: Queria が付与した緯度。原典の値か住所から求めた値。由来は geo_source
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: source=原典 / source_swapped=緯度経度を入れ替え / abr=住所から / NULL=なし
  - name: geo_level
    title: 座標の粒度
    description: 座標の粒度。原典由来は source、住所から求めたものは町字〜住居番号
  - name: geometry
    title: ジオメトリ
    description: geo_lat / geo_lon の POINT。座標が無い行は NULL
  - name: crs
    title: 座標参照系
  - name: crs_code
    title: 座標参照系コード
  - name: polling_place_type
    title: 投票所区分
    description: 「投票所」「期日前投票所」等の区分
  - name: voting_district
    title: 投票区名
  - name: election_type
    title: 選挙区分
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON）
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
annotations:
  queria:
    themes: [government_finance]
