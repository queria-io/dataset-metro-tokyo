schema: ods
name: source_files
title: ODS取り込み結果
description: '自治体標準ODS取り込みの実行結果。どの自治体のどのファイルを

  取り込んだか・スキップや失敗の理由・エンコーディング・行数を記録する。

  基本は1行=1リソースだが、種別に一致しながらCSVリソースを1つも持たない

  パッケージは、パッケージ単位で1行（status=skipped / reason=no_csv_resource）記録する。

  種別ごとの自治体カバレッジの把握に使う。'
keywords:
  - 東京都
  - 自治体標準オープンデータセット
  - ODS
published: true
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: dataset_id
    title: 種別ID
    description: ODS のデータセット種別（evacuation_space 等）
  - name: org_code
    title: 提供組織コード
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: package_title
    title: データセット名
  - name: resource_id
    title: リソースID
    description: CSVリソースが無く、パッケージ単位で記録した行では空
  - name: resource_name
    title: リソース名
    description: CSVリソースが無く、パッケージ単位で記録した行では空
  - name: url
    title: 取得元URL
    description: CSVリソースが無く、パッケージ単位で記録した行では空
  - name: status
    title: 取得結果
    description: ok / failed（取得エラー）/ skipped（ヘッダー不一致・CSV未登録等）
  - name: reason
    title: 理由
    description: 'failed / skipped の理由。no_csv_resource は種別に一致したが

      CSVリソースが無いことを表し、formats= に実際の登録形式が入る'
  - name: encoding
    title: エンコーディング
    description: 判定されたエンコーディング（utf-8-sig / cp932 等）
  - name: row_count
    title: 行数
    description: 取り込んだデータ行数（status=ok のみ）
  - name: fetched_at
    title: 取得日時
