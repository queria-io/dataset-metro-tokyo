schema: ods
name: tourism
title: 観光施設
description: '都内区市町村が公開する「観光施設一覧」（自治体標準オープンデータセット）を横断統合した

  テーブル。観光施設の位置・利用可能時間・料金・アクセス方法・バリアフリー情報を収録する。

  公開しているのは一部の自治体のみ（カバレッジは ods.source_files を参照）。

  文化財を観光資源として扱う場合は ods.cultural_property も併せて参照する。'
keywords:
  - 東京都
  - 観光
  - 施設
  - 自治体標準オープンデータセット
  - GIS
published: true
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    description: 6桁の全国地方公共団体コード（元データの表記のまま。5桁の場合もある）
  - name: facility_id
    title: ID
    description: 自治体内で一意の施設 ID（元データの ID / NO 列）
  - name: name
    title: 名称
  - name: name_kana
    title: 名称カナ
  - name: name_en
    title: 名称_英語
  - name: poi_code
    title: POIコード
    description: 共通語彙基盤の POI コード（統制語彙）
  - name: address
    title: 所在地
    description: 所在地の連結表記（旧形式の「住所」列を含む）
  - name: prefecture
    title: 都道府県
  - name: city
    title: 市区町村
  - name: building_name
    title: 建物名等(方書)
  - name: postal_code
    title: 郵便番号
  - name: lat
    title: 緯度
    description: 十進度
  - name: lon
    title: 経度
    description: 十進度
  - name: geo_lat
    title: 緯度（地図表示用）
    description: 'Queria が付与。原典の緯度経度が使えればその値、緯度と経度が入れ替わっていれば入れ替えた値。

      原典に使える座標が無い行は住所から求めた座標。採用できなければ NULL。由来は geo_source を見る'
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: 'source=原典の緯度経度をそのまま採用、source_swapped=原典で緯度と経度が入れ替わっていたので入れ替えて採用、

      abr=原典に使える座標が無く住所から求めた座標を採用、NULL=採用できる座標が無い'
  - name: geo_level
    title: 座標の粒度
    description: '原典由来は source。住所から求めた座標は abr-geocoder の粒度で、細かい順に

      residential_detail（住居番号）/ residential_block（街区）/ machiaza_detail（丁目）/ machiaza（町字）。

      市区町村の代表点は位置の情報にならないため採用していない'
  - name: geometry
    title: ジオメトリ
    description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
  - name: corporate_number
    title: 法人番号
    description: 情報の管理主体が地方公共団体以外の場合の法人番号
  - name: available_days
    title: 利用可能曜日
  - name: start_time
    title: 開始時間
  - name: end_time
    title: 終了時間
  - name: available_notes
    title: 利用可能日時特記事項
  - name: fee
    title: 料金(基本)
    description: 日本円。数値化できない表記は NULL
  - name: fee_details
    title: 料金(詳細)
  - name: description
    title: 説明
  - name: description_en
    title: 説明_英語
  - name: access
    title: アクセス方法
  - name: parking
    title: 駐車場情報
  - name: barrier_free
    title: バリアフリー情報
    description: 旧形式の自由記述欄。新形式の項目別バリアフリー列は extras に入る
  - name: contact_name
    title: 連絡先名称
  - name: contact_phone
    title: 連絡先電話番号
  - name: contact_extension
    title: 連絡先内線番号
  - name: image
    title: 画像
    description: 画像の格納先 URL
  - name: image_license
    title: 画像_ライセンス
  - name: url
    title: URL
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON）。項目別バリアフリー情報等
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
