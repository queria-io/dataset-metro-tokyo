description: '都内区市町村が公開する「公衆無線LANアクセスポイント一覧」（自治体標準オープン

  データセット）を横断統合したテーブル。SSID・提供エリア・設置者を持つ。

  公開しているのは一部の自治体のみ（カバレッジは ods.source_files を参照）。'
