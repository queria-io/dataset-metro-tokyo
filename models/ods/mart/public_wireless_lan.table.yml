schema: ods
name: public_wireless_lan
title: 公衆無線LAN
description: |-
  都内の区市町村が公開する「公衆無線LANアクセスポイント一覧」（自治体標準オープンデータセット）を統合したものです。SSID・提供エリア・設置者を持ちます。

  - 公開している自治体は一部だけです。どの自治体のファイルを収録したかは `ods.source_files` にあります
  - 地図に表示するときは、Queria が付与した `geo_lat`・`geo_lon` を使ってください（由来は `geo_source`）
keywords:
  - 東京都
  - Wi-Fi
  - 公衆無線LAN
  - 自治体標準オープンデータセット
  - GIS
published: true
themes: [ict_science]
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    semantic: { role: entity, name: city }
  - name: facility_id
    title: ID
    description: 元データの ID / NO 列。Excel の指数表記のまま復元できない値がある
  - name: name
    title: 名称
    description: アクセスポイント（設置施設）の名称
  - name: name_kana
    title: 名称カナ
  - name: address
    title: 所在地
  - name: prefecture
    title: 都道府県
  - name: city
    title: 市区町村
  - name: postal_code
    title: 郵便番号
    semantic: { role: entity, name: postal_code }
  - name: phone_number
    title: 電話番号
  - name: lat
    title: 緯度
  - name: lon
    title: 経度
  - name: geo_lat
    title: 緯度（地図表示用）
    description: Queria が付与した緯度。原典の値か住所から求めた値。由来は geo_source
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: source=原典 / source_swapped=緯度経度を入れ替え / abr=住所から / NULL=なし
  - name: geo_level
    title: 座標の粒度
    description: 座標の粒度。原典由来は source、住所から求めたものは町字〜住居番号
  - name: geometry
    title: ジオメトリ
    description: geo_lat / geo_lon の POINT。座標が無い行は NULL
  - name: installer
    title: 設置者
  - name: ssid
    title: SSID
    description: 複数値は ; 区切り
  - name: coverage_area
    title: 提供エリア
  - name: url
    title: URL
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON）
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
