schema: ods
name: evacuation_space
title: 指定緊急避難場所
description: |-
  都内の区市町村が公開する「指定緊急避難場所一覧」（自治体標準オープンデータセット）を統合したものです。災害の種類ごとの対応の可否を持ちます。

  - 公開している自治体は一部だけです。どの自治体のファイルを収録したかは `ods.source_files` にあります
  - 地図に表示するときは、Queria が付与した `geo_lat`・`geo_lon` を使ってください（由来は `geo_source`）
  - 全国の避難場所は `gsi.emergency_evacuation_site` にあります
keywords:
  - 東京都
  - 防災
  - 避難場所
  - 自治体標準オープンデータセット
  - GIS
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    description: 6桁の全国地方公共団体コード（元データの表記のまま。5桁の場合もある）
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: facility_id
    title: ID
    description: 元データの ID / NO 列。Excel の指数表記のまま復元できない値がある
  - name: name
    title: 名称
  - name: name_kana
    title: 名称カナ
  - name: address
    title: 所在地
    description: 所在地の連結表記（旧形式の「住所」列を含む）
  - name: prefecture
    title: 都道府県
  - name: city
    title: 市区町村
  - name: postal_code
    title: 郵便番号
    annotations: { queria: { semantic: { role: entity, name: postal_code } } }
  - name: phone_number
    title: 電話番号
  - name: lat
    title: 緯度
    description: 十進度
  - name: lon
    title: 経度
    description: 十進度
  - name: geo_lat
    title: 緯度（地図表示用）
    description: Queria が付与した緯度。原典の値か住所から求めた値。由来は geo_source
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: source=原典 / source_swapped=緯度経度を入れ替え / abr=住所から / NULL=なし
  - name: geo_level
    title: 座標の粒度
    description: 座標の粒度。原典由来は source、住所から求めたものは町字〜住居番号
  - name: geometry
    title: ジオメトリ
    description: geo_lat / geo_lon の POINT。座標が無い行は NULL
  - name: elevation
    title: 標高
    description: メートル
  - name: for_flood
    title: 災害種別_洪水
    description: 対応=true、非対応=false、不明=NULL（以下の災害種別も同じ）
  - name: for_landslide
    title: 災害種別_崖崩れ土石流地滑り
  - name: for_storm_surge
    title: 災害種別_高潮
  - name: for_earthquake
    title: 災害種別_地震
  - name: for_tsunami
    title: 災害種別_津波
  - name: for_large_fire
    title: 災害種別_大規模な火事
  - name: for_inland_flooding
    title: 災害種別_内水氾濫
  - name: for_volcano
    title: 災害種別_火山現象
  - name: shelter_overlap
    title: 指定避難所との重複
  - name: capacity_note
    title: 想定収容人数
    description: 元データの表記のまま（「810人（2平方メートルあたり1人）」等の自由記述）
  - name: target_area
    title: 対象地区
    description: 対象となる町会・自治会等（; 区切り）
  - name: url
    title: URL
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON、ヘッダー名→値）
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
annotations:
  queria:
    themes: [justice_safety_environment]
