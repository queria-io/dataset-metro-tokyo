    title: 全国地方公共団体コード
    description: 情報の管理主体の全国地方公共団体コード（元データの表記のまま。6桁）
  - name: area_code
    title: 地域コード
    description: 自治体が管理する地域コード（元データの表記のまま。付番済の自治体のみ）
  - name: organization_name
