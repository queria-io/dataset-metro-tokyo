schema: ods
name: population
title: 地域・年齢別人口
description: '都内区市町村が公開する「地域・年齢別人口」（自治体標準オープンデータセット）を

  横断統合したテーブル。1行 = 地域 × 調査年月日で、総人口・男女別人口に加えて

  5歳階級×男女の人口（0-4歳〜85歳以上）と世帯数をワイドに持つ。町丁字単位で

  公開する自治体（区部・練馬区など）と、自治体全体の1行のみで公開する自治体が混在する。

  同一ファイル内に複数の調査年月日を追記する方式のため、時系列比較は survey_date で行う。

  公開しているのは一部の自治体のみ（カバレッジは ods.source_files を参照）。

  年齢階級を縦持ちで扱いたい場合は補助ビュー population_by_age を利用できる。

  独自形式（1歳刻み・性別を行持ちするクロス集計など）で公開する自治体は

  標準形式ではないため収録していない。'
keywords:
  - 東京都
  - 人口
  - 年齢別人口
  - 自治体標準オープンデータセット
published: true
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
