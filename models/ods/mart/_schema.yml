        meta:
          title: データセット名
      - name: resource_id
        meta:
          title: リソースID
      - name: resource_name
        meta:
          title: リソース名
      - name: url
        meta:
          title: 取得元URL
      - name: status
        meta:
          title: 取得結果
          description: ok / failed（取得エラー）/ skipped（ヘッダー不一致等）
      - name: reason
