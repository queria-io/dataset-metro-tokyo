  - name: source_files
    description: |
      自治体標準ODS取り込みの実行結果（1行=1リソース）。どの自治体のどのファイルを
      取り込んだか・スキップや失敗の理由・エンコーディング・行数を記録する。
      種別ごとの自治体カバレッジの把握に使う。
    access: public
    config:
      meta:
        <<: *meta
        title: "ODS取り込み結果"
    columns:
      - name: dataset_id
        meta:
          title: 種別ID
          description: ODS のデータセット種別（evacuation_space 等）
      - name: org_code
        meta:
          title: 提供組織コード
      - name: org_title
        meta:
          title: 提供組織名
      - name: package_id
        meta:
          title: データセットID
          description: catalog.datasets との結合キー
      - name: package_title
        meta:
          title: データセット名
      - name: resource_id
        meta:
          title: リソースID
      - name: resource_name
        meta:
          title: リソース名
      - name: url
        meta:
          title: 取得元URL
      - name: status
        meta:
          title: 取得結果
          description: ok / failed（取得エラー）/ skipped（ヘッダー不一致等）
      - name: reason
        meta:
          title: 理由
          description: failed / skipped の理由
      - name: encoding
        meta:
          title: エンコーディング
          description: 判定されたエンコーディング（utf-8-sig / cp932 等）
      - name: row_count
        meta:
          title: 行数
          description: 取り込んだデータ行数（status=ok のみ）
      - name: fetched_at
        meta:
          title: 取得日時
