  - name: population_by_age
    description: |
      地域・年齢別人口（ods.population）を年齢階級×性別で縦持ちにした補助ビュー。
      1行 = 地域 × 調査年月日 × 年齢階級 × 性別 → 人口。人口ピラミッドや高齢化率など
      年齢階級別の集計・可視化を容易にするために提供する。
    access: public
