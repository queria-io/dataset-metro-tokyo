  - name: source_files
    description: |
      自治体標準ODS取り込みの実行結果（1行=1リソース）。どの自治体のどのファイルを
      取り込んだか・スキップや失敗の理由・エンコーディング・行数を記録する。
      種別ごとの自治体カバレッジの把握に使う。
    access: public
    config:
      meta:
        <<: *meta
        title: "ODS取り込み結果"
    columns:
      - name: dataset_id
        meta:
          title: 種別ID
          description: ODS のデータセット種別（evacuation_space 等）
      - name: org_code
        meta:
          title: 提供組織コード
      - name: org_title
        meta:
          title: 提供組織名
      - name: package_id
        meta:
          title: データセットID
