schema: ods
name: bicycle_parking
title: 自転車駐車場
description: |-
  都内の区市町村が公開する「自転車駐車場一覧」（自治体標準オープンデータセット）を統合したものです。収容台数・屋内外の区分・利用時間・料金を持ちます。

  - 公開している自治体は一部だけです。どの自治体のファイルを収録したかは `ods.source_files` にあります
  - 地図に表示するときは、Queria が付与した `geo_lat`・`geo_lon` を使ってください（由来は `geo_source`）
keywords:
  - 東京都
  - 自転車駐車場
  - 駐輪場
  - 交通
  - 自治体標準オープンデータセット
  - GIS
published: true
themes: [transport_tourism]
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    semantic: { role: entity, name: city }
  - name: facility_id
    title: ID
  - name: organization_name
    title: 地方公共団体名
  - name: name
    title: 名称
    description: 駐輪場の名称
  - name: name_kana
    title: 名称カナ
  - name: name_en
    title: 名称英字
  - name: name_alias
    title: 名称通称
  - name: poi_code
    title: POIコード
  - name: address
    title: 所在地
    description: 分割形式の自治体では空になり緯度経度のみを持つ場合がある
  - name: prefecture
    title: 都道府県
  - name: city
    title: 市区町村
  - name: building_name
    title: 建物名等（方書）
  - name: postal_code
    title: 郵便番号
    semantic: { role: entity, name: postal_code }
  - name: phone_number
    title: 電話番号
  - name: lat
    title: 緯度
  - name: lon
    title: 経度
  - name: geo_lat
    title: 緯度（地図表示用）
    description: Queria が付与した緯度。原典の値か住所から求めた値。由来は geo_source
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: source=原典 / source_swapped=緯度経度を入れ替え / abr=住所から / NULL=なし
  - name: geo_level
    title: 座標の粒度
    description: 座標の粒度。原典由来は source、住所から求めたものは町字〜住居番号
  - name: geometry
    title: ジオメトリ
    description: geo_lat / geo_lon の POINT。座標が無い行は NULL
  - name: indoor_outdoor
    title: 屋内外
    description: 「屋内」「屋外」等の区分（元データの表記のまま）
  - name: capacity
    title: 最大駐輪台数
    description: 自転車の収容台数
  - name: nearest_station
    title: 最寄駅
  - name: available_days
    title: 利用可能曜日
  - name: start_time
    title: 開始時間
  - name: end_time
    title: 終了時間
  - name: available_notes
    title: 利用可能日時特記事項
  - name: fee_type
    title: 料金種別
  - name: fee
    title: 料金
  - name: fee_details
    title: 料金備考
  - name: payment_type
    title: 決済種別
  - name: opened_date
    title: 開設日
  - name: description
    title: 説明
    description: 構造・利用区分・種別ごとの収容台数などの補足（自治体により内容が異なる）
  - name: url
    title: URL
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON）
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
