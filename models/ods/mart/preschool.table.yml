schema: ods
name: preschool
title: 子育て施設
description: |-
  都内の区市町村が公開する「子育て施設一覧」（自治体標準オープンデータセット）を統合したものです。施設の種別・収容定員・受入年齢・一時預かりの有無を持ちます。

  - 公開している自治体は一部だけです。どの自治体のファイルを収録したかは `ods.source_files` にあります
  - 地図に表示するときは、Queria が付与した `geo_lat`・`geo_lon` を使ってください（由来は `geo_source`）
  - 都内全域の認可保育所・児童館は `childcare` にあります
keywords:
  - 東京都
  - 子育て
  - 保育所
  - 自治体標準オープンデータセット
  - GIS
published: true
themes: [social_security_health]
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    semantic: { role: entity, name: city }
  - name: facility_id
    title: ID
    description: 元データの ID / NO 列。Excel の指数表記のまま復元できない値がある
  - name: name
    title: 名称
  - name: name_kana
    title: 名称カナ
  - name: facility_type
    title: 種別
    description: 施設の種別（認可保育所・認定こども園・幼稚園等、元データの表記のまま）
  - name: address
    title: 所在地
  - name: prefecture
    title: 都道府県
  - name: city
    title: 市区町村
  - name: postal_code
    title: 郵便番号
    semantic: { role: entity, name: postal_code }
  - name: phone_number
    title: 電話番号
  - name: lat
    title: 緯度
  - name: lon
    title: 経度
  - name: geo_lat
    title: 緯度（地図表示用）
    description: Queria が付与した緯度。原典の値か住所から求めた値。由来は geo_source
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: source=原典 / source_swapped=緯度経度を入れ替え / abr=住所から / NULL=なし
  - name: geo_level
    title: 座標の粒度
    description: 座標の粒度。原典由来は source、住所から求めたものは町字〜住居番号
  - name: geometry
    title: ジオメトリ
    description: geo_lat / geo_lon の POINT。座標が無い行は NULL
  - name: access
    title: アクセス方法
  - name: parking
    title: 駐車場情報
  - name: corporate_name
    title: 団体名
    description: 運営法人名
  - name: capacity
    title: 収容定員
    description: 人。数値化できない表記は NULL
  - name: age_range
    title: 受入年齢
  - name: available_days
    title: 利用可能曜日
  - name: start_time
    title: 開始時間
  - name: end_time
    title: 終了時間
  - name: available_notes
    title: 利用可能日時特記事項
  - name: temporary_care
    title: 一時預かり
    description: 有=true、無=false、不明=NULL
  - name: sick_care
    title: 病児保育
    description: 有=true、無=false、不明=NULL
  - name: url
    title: URL
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON）
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
