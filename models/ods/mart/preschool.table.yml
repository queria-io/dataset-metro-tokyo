schema: ods
name: preschool
title: 子育て施設
description: '都内区市町村が公開する「子育て施設一覧」（自治体標準オープンデータセット）を

  横断統合したテーブル。施設種別・収容定員・受入年齢・一時預かり/病児保育の有無を持つ。

  公開しているのは一部の自治体のみ（カバレッジは ods.source_files を参照）。

  都全域の認可保育所・児童館は childcare スキーマ（東京都福祉局）にもある。'
keywords:
  - 東京都
  - 子育て
  - 保育所
  - 自治体標準オープンデータセット
  - GIS
published: true
sources:
