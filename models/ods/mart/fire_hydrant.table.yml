schema: ods
name: fire_hydrant
title: 消防水利施設
description: |-
  都内の区市町村が公開する「消防水利施設一覧」（自治体標準オープンデータセット）を統合したものです。1 行が 1 水利で、消火栓・防火水槽などの位置と口径を持ちます。

  - 公開している自治体は一部だけです。どの自治体のファイルを収録したかは `ods.source_files` にあります
  - 地図に表示するときは、Queria が付与した `geo_lat`・`geo_lon` を使ってください（由来は `geo_source`）
keywords:
  - 東京都
  - 防災
  - 消防
  - 消火栓
  - 自治体標準オープンデータセット
  - GIS
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    description: 情報の管理主体の6桁の全国地方公共団体コード
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: facility_id
    title: ID
    description: 自治体内で一意の施設 ID（元データの ID / NO 列）。付番していない自治体は NULL
  - name: facility_type
    title: 種別
    description: 消火栓・防火水槽・プール・河川など。表記は自治体ごとに違う
  - name: organization_name
    title: 地方公共団体名
  - name: address
    title: 所在地
    description: 所在地の連結表記（旧形式の「住所」列を含む）
  - name: prefecture
    title: 所在地_都道府県
  - name: city
    title: 所在地_市区町村
  - name: town
    title: 所在地_町字
  - name: street_number
    title: 所在地_番地以下
  - name: building_name
    title: 建物名等（方書）
  - name: town_id
    title: 町字ID
    description: アドレス・ベース・レジストリの町字ID（記載している自治体のみ）
  - name: location_municipality_code
    title: 所在地_全国地方公共団体コード
    description: 水利の所在地の6桁コード。管轄外にある場合は管理主体のコードと異なる
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: lat
    title: 緯度
  - name: lon
    title: 経度
  - name: geo_lat
    title: 緯度（地図表示用）
    description: Queria が付与した緯度。原典の値か住所から求めた値。由来は geo_source
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: source=原典 / source_swapped=緯度経度を入れ替え / abr=住所から / NULL=なし
  - name: geo_level
    title: 座標の粒度
    description: 座標の粒度。原典由来は source、住所から求めたものは町字〜住居番号
  - name: geometry
    title: ジオメトリ
    description: geo_lat / geo_lon の POINT。座標が無い行は NULL
  - name: diameter
    title: 口径
    description: 対応する口径（ミリメートル）。記載のない水利は NULL
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON）。容量・目標施設など自治体独自の項目
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
annotations:
  queria:
    themes: [justice_safety_environment]
