schema: ods
name: fire_hydrant
title: 消防水利施設
description: '都内区市町村が公開する「消防水利施設一覧」（自治体標準オープンデータセット）を

  横断統合したテーブル。1行=1水利で、消火栓・防火水槽・プール・河川など消防が

  消火用水として使える水利の位置と口径を持つ。名称の列は定義上持たず、種別で識別する。

  公開しているのは一部の自治体のみ（カバレッジは ods.source_files を参照）。

  標準形式ではない独自様式（管轄・水利番号の一覧など）は収録していない。'
keywords:
  - 東京都
  - 防災
  - 消防
  - 消火栓
  - 自治体標準オープンデータセット
  - GIS
published: true
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    description: 情報の管理主体の6桁の全国地方公共団体コード
  - name: facility_id
    title: ID
    description: 自治体内で一意の施設 ID（元データの ID / NO 列）。付番していない自治体は NULL
  - name: facility_type
    title: 種別
    description: 消火栓・防火水槽・プール・河川など水利の種類。統制語彙が無く自治体ごとに表記が揺れる（防火水槽 / 防火水そう など）ため生値のまま
  - name: organization_name
    title: 地方公共団体名
  - name: address
    title: 所在地
    description: 所在地の連結表記（旧形式の「住所」列を含む）
  - name: prefecture
    title: 所在地_都道府県
  - name: city
    title: 所在地_市区町村
  - name: town
    title: 所在地_町字
  - name: street_number
    title: 所在地_番地以下
  - name: building_name
    title: 建物名等（方書）
  - name: town_id
    title: 町字ID
    description: アドレス・ベース・レジストリの町字ID（記載している自治体のみ）
  - name: location_municipality_code
    title: 所在地_全国地方公共団体コード
    description: 水利の所在地の6桁コード。管轄外にある場合は管理主体のコードと異なる
  - name: lat
    title: 緯度
  - name: lon
    title: 経度
  - name: geo_lat
    title: 緯度（地図表示用）
    description: 'Queria が付与。原典の緯度経度が使えればその値、緯度と経度が入れ替わっていれば入れ替えた値。

      原典に使える座標が無い行は住所から求めた座標。採用できなければ NULL。由来は geo_source を見る'
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: 'source=原典の緯度経度をそのまま採用、source_swapped=原典で緯度と経度が入れ替わっていたので入れ替えて採用、

      abr=原典に使える座標が無く住所から求めた座標を採用、NULL=採用できる座標が無い'
  - name: geo_level
    title: 座標の粒度
    description: '原典由来は source。住所から求めた座標は abr-geocoder の粒度で、細かい順に

      residential_detail（住居番号）/ residential_block（街区）/ machiaza_detail（丁目）/ machiaza（町字）。

      市区町村の代表点は位置の情報にならないため採用していない'
  - name: geometry
    title: ジオメトリ
    description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
  - name: diameter
    title: 口径
    description: 対応する口径（ミリメートル）。記載のない水利は NULL
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON）。容量・目標施設など自治体独自の項目
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
