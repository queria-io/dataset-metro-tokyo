schema: ods
name: public_facility
title: 公共施設
description: |-
  都内の区市町村が公開する「公共施設一覧」（自治体標準オープンデータセット）を統合したものです。公民館・図書館・体育館などの名称・所在地・連絡先・利用可能時間を持ちます。

  - 公開している自治体は一部だけです。どの自治体のファイルを収録したかは `ods.source_files` にあります
  - 地図に表示するときは、Queria が付与した `geo_lat`・`geo_lon` を使ってください（由来は `geo_source`）
keywords:
  - 東京都
  - 公共施設
  - 自治体標準オープンデータセット
  - GIS
published: true
themes: [government_finance]
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    description: 6桁の全国地方公共団体コード（元データの表記のまま。5桁の場合もある）
    semantic: { role: entity, name: city }
  - name: facility_id
    title: ID
    description: 元データの ID / NO 列。Excel の指数表記のまま復元できない値がある
  - name: name
    title: 名称
  - name: name_kana
    title: 名称カナ
  - name: name_alias
    title: 名称通称
  - name: poi_code
    title: POIコード
  - name: address
    title: 所在地
    description: 所在地の連結表記（旧形式の「住所」列を含む）
  - name: prefecture
    title: 都道府県
  - name: city
    title: 市区町村
  - name: postal_code
    title: 郵便番号
    semantic: { role: entity, name: postal_code }
  - name: phone_number
    title: 電話番号
  - name: lat
    title: 緯度
    description: 十進度
  - name: lon
    title: 経度
    description: 十進度
  - name: geo_lat
    title: 緯度（地図表示用）
    description: Queria が付与した緯度。原典の値か住所から求めた値。由来は geo_source
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: source=原典 / source_swapped=緯度経度を入れ替え / abr=住所から / NULL=なし
  - name: geo_level
    title: 座標の粒度
    description: 座標の粒度。原典由来は source、住所から求めたものは町字〜住居番号
  - name: geometry
    title: ジオメトリ
    description: geo_lat / geo_lon の POINT。座標が無い行は NULL
  - name: corporate_number
    title: 法人番号
    semantic: { role: entity, name: corporate_number }
  - name: corporate_name
    title: 団体名
    description: 運営主体（指定管理者等）の名称
  - name: available_days
    title: 利用可能曜日
  - name: start_time
    title: 開始時間
  - name: end_time
    title: 終了時間
  - name: available_notes
    title: 利用可能日時特記事項
  - name: access
    title: アクセス方法
  - name: parking
    title: 駐車場情報
  - name: description
    title: 説明
  - name: url
    title: URL
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON、ヘッダー名→値）。バリアフリー設備等
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
