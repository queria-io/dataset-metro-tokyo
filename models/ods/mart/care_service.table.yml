schema: ods
name: care_service
title: 介護サービス事業所
description: '都内区市町村が公開する「介護サービス事業所一覧」（自治体標準オープンデータセット）を

  横断統合したテーブル。1行=1事業所で、訪問介護・特別養護老人ホーム・通所介護などの

  介護保険サービス事業所の名称・実施サービス・所在地・定員・運営法人を持つ。

  全国網羅の類似データとして mhlw.kaigo.establishment（介護サービス情報公表システム）が

  あり、こちらは区市町村が独自に公開する分。公開しているのは一部の自治体のみ

  （カバレッジは ods.source_files を参照）。'
keywords:
  - 東京都
  - 介護
  - 高齢者
  - 福祉
  - 自治体標準オープンデータセット
  - GIS
published: true
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    description: 情報の管理主体の全国地方公共団体コード（元データの表記のまま。5桁の場合もある）
  - name: facility_id
    title: ID
    description: 自治体内で一意の事業所 ID（元データの ID / NO 列）
  - name: name
    title: 介護サービス事業所名称
  - name: name_kana
    title: 名称カナ
  - name: name_en
    title: 名称英字
  - name: service_type
    title: 実施サービス
    description: 訪問介護・介護老人福祉施設（特別養護老人ホーム）など提供する介護サービス。統制語彙が無く自治体ごとに表記が揺れるため生値のまま
  - name: address
    title: 所在地
    description: 所在地の連結表記（旧形式の「住所」列を含む）
  - name: prefecture
    title: 都道府県
  - name: city
    title: 市区町村
  - name: town
    title: 所在地_町字
  - name: street_number
    title: 所在地_番地以下
  - name: building_name
    title: 建物名等（方書）
  - name: town_id
    title: 町字ID
    description: アドレス・ベース・レジストリの町字ID（記載している自治体のみ）
  - name: location_municipality_code
    title: 所在地_全国地方公共団体コード
    description: 事業所の所在地の全国地方公共団体コード。管轄外にある場合は管理主体のコードと異なる
  - name: postal_code
    title: 郵便番号
  - name: phone_number
    title: 電話番号
  - name: fax_number
    title: FAX番号
  - name: lat
    title: 緯度
    description: 十進度
  - name: lon
    title: 経度
    description: 十進度
  - name: geo_lat
    title: 緯度（地図表示用）
    description: 'Queria が付与。原典の緯度経度が日本の値域に収まればその値、緯度と経度が入れ替わっていれば入れ替えた値。

      採用できる座標が無ければ NULL。由来は geo_source を見る'
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: source=原典の緯度経度をそのまま採用、source_swapped=原典で緯度と経度が入れ替わっていたので入れ替えて採用、NULL=採用できる座標が無い
  - name: geo_level
    title: 座標の粒度
    description: 語彙は abr-geocoder の matchLevel に揃えてある。原典由来の座標は粒度が申告されないため source
  - name: geometry
    title: ジオメトリ
    description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
  - name: corporate_number
    title: 法人番号
    description: 運営主体の法人番号（記載している自治体のみ）。houjin_bangou と結合可能
  - name: corporate_name
    title: 法人の名称
  - name: business_number
    title: 事業所番号
    description: 介護保険事業所番号（記載している自治体のみ）
  - name: available_days
    title: 利用可能曜日
  - name: available_notes
    title: 利用可能曜日特記事項
  - name: capacity
    title: 定員
    description: サービスの定員。記載のない事業所は NULL
  - name: url
    title: URL
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON）
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
