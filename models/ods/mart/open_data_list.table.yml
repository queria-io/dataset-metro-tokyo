schema: ods
name: open_data_list
title: オープンデータ一覧
description: '都内区市町村・東京都が公開する「オープンデータ一覧」（自治体標準オープンデータセット）を

  横断統合したテーブル。1行=1データセット（またはデータセット×ファイル）のメタデータで、

  各自治体が自ら公開している「どんなオープンデータを出しているか」の目録。施設一覧ではない

  ため所在地・緯度経度の列は持たない。

  これは自治体が申告した目録であり、CKAN カタログを横断集計した catalog スキーマ

  （データセット・組織・リソースのメタデータ）とは別物。catalog は運営基盤側が全件を機械的に

  集約したメタデータ、本テーブルは各自治体が ODS 様式で手作業に近い形で公開した申告目録で、

  収録範囲・粒度・鮮度が自治体ごとに異なる。

  新標準（データセット定義書A、42列）と旧推奨データセット形式（15列）の両方の様式を統合して

  いる。公開しているのは一部の自治体のみ（カバレッジは ods.source_files を参照）。'
keywords:
  - 東京都
  - オープンデータ
  - メタデータ
  - カタログ
  - 自治体標準オープンデータセット
  - ODS
published: true
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    description: 情報の管理主体の全国地方公共団体コード（旧様式では都道府県コード又は市区町村コード）
  - name: dataset_id
    title: データセットID
    description: 自治体内で一意のデータセットID。旧様式の連番（NO）を含む
  - name: organization_name
    title: 地方公共団体名
  - name: dataset_title
    title: データセットタイトル
    description: データセットの名称（旧様式の「データ名称」を含む）
  - name: dataset_subtitle
    title: データセットサブタイトル
  - name: dataset_description
