schema: ods
name: food_business
title: 食品等営業許可・届出
description: |-
  都内の区市町村が公開する「食品等営業許可・届出一覧」（自治体標準オープンデータセット）を統合したものです。1 行が 1 施設で、営業の種類・業態・所在地・許可年月日を持ちます。

  - 公開している自治体は一部だけです。どの自治体のファイルを収録したかは `ods.source_files` にあります
  - 地図に表示するときは、Queria が付与した `geo_lat`・`geo_lon` を使ってください（由来は `geo_source`）
  - 東京都の保健所台帳は `hokenjo.food_establishment` にあります
keywords:
  - 東京都
  - 食品
  - 飲食店
  - 営業許可
  - 自治体標準オープンデータセット
  - GIS
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    description: 情報の管理主体の全国地方公共団体コード（元データの表記のまま）
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: facility_id
    title: ID
    description: 元データの ID / NO 列。Excel の指数表記のまま復元できない値がある
  - name: name
    title: 施設名称
  - name: name_kana
    title: 施設名称カナ
  - name: name_en
    title: 施設名称英字
  - name: business_type
    title: 営業の種類
    description: 飲食店営業・菓子製造業など。表記は自治体ごとに違う
  - name: business_category
    title: 業態
    description: 居酒屋・食料品販売など営業の種類より詳細な業態。記載している自治体のみ
  - name: address
    title: 所在地
    description: 所在地の連結表記（旧形式の「住所」列を含む）
  - name: prefecture
    title: 都道府県
  - name: city
    title: 市区町村
  - name: town
    title: 所在地_町字
  - name: street_number
    title: 所在地_番地以下
  - name: building_name
    title: 施設方書（建物名等）
  - name: town_id
    title: 町字ID
    description: アドレス・ベース・レジストリの町字ID（記載している自治体のみ）
  - name: location_municipality_code
    title: 所在地_全国地方公共団体コード
    description: 施設の所在地の全国地方公共団体コード。管轄外にある場合は管理主体のコードと異なる
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: postal_code
    title: 郵便番号
    annotations: { queria: { semantic: { role: entity, name: postal_code } } }
  - name: phone_number
    title: 施設電話番号
  - name: email
    title: 連絡先メールアドレス
  - name: contact_form_url
    title: 連絡先FormURL
  - name: contact_notes
    title: 連絡先備考
  - name: lat
    title: 緯度
    description: 十進度
  - name: lon
    title: 経度
    description: 十進度
  - name: geo_lat
    title: 緯度（地図表示用）
    description: Queria が付与した緯度。原典の値か住所から求めた値。由来は geo_source
  - name: geo_lon
    title: 経度（地図表示用）
    description: Queria が付与。geo_lat と対になる経度
  - name: geo_source
    title: 座標の由来
    description: source=原典 / source_swapped=緯度経度を入れ替え / abr=住所から / NULL=なし
  - name: geo_level
    title: 座標の粒度
    description: 座標の粒度。原典由来は source、住所から求めたものは町字〜住居番号
  - name: geometry
    title: ジオメトリ
    description: geo_lat / geo_lon の POINT。座標が無い行は NULL
  - name: corporate_name
    title: 法人名
    description: 申請主体が法人の場合の法人名（個人事業は空）
  - name: corporate_number
    title: 法人番号
    description: 申請主体が法人の場合の法人番号（記載している自治体のみ）。houjin_bangou と結合可能
    annotations: { queria: { semantic: { role: entity, name: corporate_number } } }
  - name: permit_number
    title: 許可番号
  - name: first_permit_date
    title: 初回許可年月日
    description: 初回に営業許可を出した年月日
  - name: permit_date
    title: 許可年月日
    description: 直近で営業許可を出した年月日
  - name: permit_start_date
    title: 許可開始日
  - name: permit_expiry_date
    title: 許可満了日
  - name: closure_date
    title: 廃業年月日
    description: 廃業届を受理した廃業日（廃業していなければ空）
  - name: application_type
    title: 申請区分
    description: 受理した申請の区分（新規・継続・変更・廃業など）。統制語彙だが自治体ごとに表記が揺れるため生値のまま
  - name: permit_condition
    title: 許可条件
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON）
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
annotations:
  queria:
    themes: [commerce_services, social_security_health]
