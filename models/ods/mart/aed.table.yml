schema: ods
name: aed
title: AED設置箇所
description: '都内区市町村が公開する「AED設置箇所一覧」（自治体標準オープンデータセット）を

  横断統合したテーブル。設置位置・利用可能日時・小児対応設備の有無を持つ。

  公開しているのは一部の自治体のみ（カバレッジは ods.source_files を参照）。'
keywords:
  - 東京都
  - AED
  - 救急
  - 自治体標準オープンデータセット
  - GIS
published: true
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
  - name: facility_id
    title: ID
  - name: name
    title: 名称
    description: 設置施設の名称
  - name: name_kana
    title: 名称カナ
  - name: address
    title: 所在地
  - name: prefecture
    title: 都道府県
  - name: city
    title: 市区町村
  - name: postal_code
    title: 郵便番号
  - name: phone_number
    title: 電話番号
  - name: lat
    title: 緯度
  - name: lon
    title: 経度
  - name: install_position
    title: 設置位置
    description: 施設内のどこに設置されているか（「1階受付横」等）
  - name: available_days
    title: 利用可能曜日
  - name: start_time
    title: 開始時間
  - name: end_time
    title: 終了時間
  - name: available_notes
    title: 利用可能日時特記事項
  - name: for_children
    title: 小児対応設備
    description: 有=true、無=false、不明=NULL
  - name: url
    title: URL
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON）
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
