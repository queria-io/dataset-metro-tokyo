schema: ods
name: cultural_property
title: 文化財
description: '都内区市町村が公開する「文化財一覧」（自治体標準オープンデータセット）を横断統合した

  テーブル。文化財保護法および地方公共団体の文化財保護条例に基づき指定・登録・選定された

  文化財を、分類（重要文化財・都指定文化財・区登録有形文化財等）・種類・所有者・指定日・

  所在地とともに収録する。無形文化財や個人所有で住所非公開のものを含むため、緯度経度が

  入らない行がある。公開しているのは一部の自治体のみ（カバレッジは ods.source_files を参照）。'
keywords:
  - 東京都
  - 文化財
  - 歴史
  - 観光
  - 自治体標準オープンデータセット
  - GIS
published: true
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/
fields:
  - name: municipality_code
    title: 全国地方公共団体コード
    description: 6桁の全国地方公共団体コード（元データの表記のまま。5桁の場合もある）
  - name: facility_id
    title: ID
    description: 自治体内で一意の ID（元データの ID / NO 列）
  - name: name
    title: 名称
  - name: name_kana
    title: 名称カナ
  - name: name_alias
    title: 名称_通称
  - name: name_en
    title: 名称_英語
  - name: property_class
    title: 文化財分類
    description: 重要文化財・都指定文化財・区登録有形文化財など。複数指定は「;」区切り
  - name: property_type
    title: 種類
    description: 建造物・美術工芸品・無形民俗文化財・考古資料など
  - name: place_name
    title: 場所名称
    description: 文化財が設置されている施設・建物などの名称
  - name: address
    title: 所在地
    description: 所在地の連結表記（旧形式の「住所」列を含む）
  - name: prefecture
    title: 都道府県
  - name: city
    title: 市区町村
  - name: building_name
    title: 建物名等(方書)
  - name: postal_code
    title: 郵便番号
  - name: phone_number
    title: 電話番号
  - name: lat
    title: 緯度
    description: '十進度。無形文化財・住所非公開のものは NULL。

      元データで緯度と経度が入れ替わっている自治体がある（豊島区の全行）。

      値の入れ替えは行わず原典のまま保持しているため、地図表示の前に値域で確認すること'
  - name: lon
    title: 経度
    description: 十進度。緯度と同じ注意点がある（元データの入れ替わりを補正していない）
  - name: quantity
    title: 員数（数）
    description: 数値化できない表記は NULL
  - name: quantity_unit
    title: 員数（単位）
    description: 棟・基・幅・軀・双など
  - name: corporate_number
    title: 法人番号
    description: 所有者・管理者・保護団体等の法人番号（元データの表記のまま）
  - name: owner
    title: 所有者等
    description: 所有者・管理者・保護団体等。個人所有は「個人」と記載される
  - name: designated_date
    title: 文化財指定日
    description: 原典の文字列のまま。日不明を 99 で埋める表記（1982-04-99 等）があるため日付型にしていない
  - name: available_days
    title: 利用可能曜日
    description: 公開している文化財のみ
  - name: start_time
    title: 開始時間
  - name: end_time
    title: 終了時間
  - name: available_notes
    title: 利用可能日時特記事項
  - name: image
    title: 画像
    description: 画像の格納先 URL
  - name: image_license
    title: 画像_ライセンス
  - name: summary
    title: 概要
  - name: summary_en
    title: 概要_英語
  - name: description
    title: 説明
  - name: description_en
    title: 説明_英語
  - name: url
    title: URL
  - name: notes
    title: 備考
  - name: extras
    title: 追加列
    description: 標準列にマッピングできなかった元データの列（JSON）。指定番号・作成年代等
  - name: org_code
    title: 提供組織コード
    description: catalog.organizations との結合キー
  - name: org_title
    title: 提供組織名
  - name: package_id
    title: データセットID
    description: catalog.datasets との結合キー
  - name: source_url
    title: 取得元URL
