schema: stats
name: labour_bonus
title: 毎月勤労統計調査 夏季・冬季賞与
description: |-
  毎月勤労統計調査（地方調査）の、東京都の事業所規模 30 人以上の夏季賞与と冬季賞与の支給状況です。1 行が 1 年・産業で、2013 年からです。

  - 夏季賞与はその年の 6〜8 月、冬季賞与はその年の 11 月〜翌年 1 月に支払われた賞与です
  - 1 人平均支給額は、賞与を支給した事業所の常用労働者 1 人あたりの額です。賞与を支給しなかった事業所の労働者は分母に入りません
  - 産業の区分は 2018 年から 17 区分に減りました。年をまたいで比べるときは `industry_code` で揃えてください
keywords:
  - 東京都
  - 毎月勤労統計
  - 賞与
  - ボーナス
  - 夏季賞与
  - 冬季賞与
  - 産業
  - 時系列
published: true
themes: [labour]
sources:
