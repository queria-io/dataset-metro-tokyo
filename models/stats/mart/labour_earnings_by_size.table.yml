schema: stats
name: labour_earnings_by_size
title: 毎月勤労統計調査 規模別月間現金給与額
description: |-
  毎月勤労統計調査（地方調査）の、東京都の月間現金給与額を事業所規模の 4 区分に分けたものです。1 行が 1 年・月（または年平均）・事業所規模で、2013 年からです。

  - 産業は調査産業計だけです
keywords:
  - 東京都
  - 毎月勤労統計
  - 賃金
  - 給与
  - 賞与
  - 事業所規模
  - 時系列
published: true
themes: [labour]
sources:
  - path: https://www.toukei.metro.tokyo.lg.jp/maikin/mk-index.htm
fields:
  - name: year
    title: 年
    description: 対象年（西暦）
  - name: period_type
    title: 期間区分
    description: 月次 / 年平均
  - name: month
    title: 月
    description: 対象月（1〜12）。年平均の行は NULL
  - name: establishment_size
    title: 事業所規模
    description: 5〜29人 / 30〜99人 / 100〜499人 / 500人以上。区分は重ならない
  - name: cash_earnings
    title: 現金給与総額
    description: 1 人平均の月間現金給与総額（円）。税・社会保険料を引く前の額
  - name: cash_earnings_male
    title: 現金給与総額（男）
    description: 円
  - name: cash_earnings_female
    title: 現金給与総額（女）
    description: 円
  - name: contractual_earnings
    title: きまって支給する給与
    description: きまって支給する給与（円）。所定内給与と所定外給与の合計
  - name: contractual_earnings_male
    title: きまって支給する給与（男）
    description: 円
  - name: contractual_earnings_female
    title: きまって支給する給与（女）
    description: 円
  - name: scheduled_earnings
    title: 所定内給与
    description: きまって支給する給与のうち所定外給与以外のもの（円）
  - name: overtime_earnings
    title: 所定外給与
    description: 時間外・休日・深夜の労働に支給される給与（円）
  - name: special_earnings
    title: 特別に支払われた給与
    description: 賞与など、一時的・突発的な理由で支払われた給与（円）
  - name: special_earnings_male
    title: 特別に支払われた給与（男）
    description: 円
  - name: special_earnings_female
    title: 特別に支払われた給与（女）
    description: 円
