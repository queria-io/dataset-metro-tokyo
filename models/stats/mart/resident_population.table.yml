schema: stats
name: resident_population
title: 住民基本台帳による世帯と人口
description: |-
  東京都の住民基本台帳による世帯数と人口の月次の値です。1 行が 1 月・1 地域で、2001 年 1 月分からです。

  - 区部・市部などの集計行を含みます。区市町村だけを見るときは `area_type = '区市町村'` で絞ってください
  - 外国人の人口は 2012 年 7 月分まで外国人登録者数、8 月分から住民基本台帳の人口です。この間の増減は制度の変更を含みます
keywords:
  - 東京都
  - 人口
  - 世帯
  - 住民基本台帳
  - 時系列
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/organization/t000003
fields:
  - name: year_month
    title: 年月
    description: 対象年月（YYYY-MM）
  - name: as_of_date
    title: 現在日
    description: 集計時点（各月1日）
  - name: area_code
    title: 地域コード
    description: 全国地方公共団体コードの上5桁。集計行は都が付す地域コード（総数13000・区部13100など）
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: area_name
    title: 地域
  - name: area_type
    title: 地域区分
    description: 総数 / 地域区分（区部・市部・町村部・郡部・島部）/ 支庁 / 区市町村。地域コードから導出
  - name: population_total
    title: 人口総数
    description: 日本人と外国人の合計（人）
  - name: population_change
    title: 前月差
    description: 前月の人口総数との増減（人）。原典が '-' の月は NULL
  - name: japanese_total
    title: 日本人人口
    description: 住民基本台帳に記録された日本人の人口（人）
  - name: japanese_male
    title: 日本人人口（男）
  - name: japanese_female
    title: 日本人人口（女）
  - name: foreign_total
    title: 外国人人口
    description: 2012年7月分までは外国人登録者数、2012年8月分以降は住民基本台帳上の人口（人）
  - name: foreign_male
    title: 外国人人口（男）
    description: 2012年9月分以降のみ。それ以前は原典に無く NULL
  - name: foreign_female
    title: 外国人人口（女）
    description: 2012年9月分以降のみ。それ以前は原典に無く NULL
  - name: household_total
    title: 世帯数
    description: 住民基本台帳上の世帯数。2012年7月分までは外国人世帯を含まない
  - name: household_japanese_only
    title: 日本人のみの世帯数
    description: 2012年9月分以降のみ。それ以前は原典に無く NULL
  - name: household_foreign_only
    title: 外国人のみの世帯数
    description: 2012年9月分以降のみ。それ以前は原典に無く NULL
  - name: household_mixed
    title: 複数国籍世帯数
    description: 日本人と外国人が同居する世帯数。2012年9月分以降のみ
annotations:
  queria:
    themes: [population]
