schema: stats
name: labour_force_quarterly
title: 東京の労働力 四半期別の就業状態・産業別就業者数・完全失業率
description: |-
  労働力調査の東京都分を東京都が集計した「東京の労働力」の四半期平均の第 1 表です。区分は年平均の labour_force と同じで、15 歳以上人口の就業状態、主な産業別の就業者数と雇用者数、従業者規模別の雇用者数、年齢階級別の完全失業率、就業率、労働力人口比率を男女別に持ちます。1 行が 1 四半期・分類・区分・男女で、2003 年 7〜9 月期からです。

  - 値は四半期（1〜3 月・4〜6 月・7〜9 月・10〜12 月）の平均です。季節調整はしていないので、四半期をまたぐ変化は前年同期との比較（change と change_rate）で見てください
  - 前年同期の値は、基準人口を切り替えた年（2012・2017・2022 年）と産業分類を改定した年（2009 年）は前年の表の実数と違います
  - 千人単位の区分の 4 四半期の平均は、labour_force の年平均と丸めの範囲（差 1 まで）で一致します
  - 雇用者の主な産業別内訳は 2005 年 4〜6 月期から、正規・非正規の職員・従業員は 2013 年から、就業率は 2017 年からです
