schema: stats
name: labour_force_by_age
title: 東京の労働力 年齢階級別就業状態
description: |-
  労働力調査の東京都分を東京都が集計した「東京の労働力」の年平均の第 3 表です。15 歳以上人口・労働力人口・就業者数・完全失業者数・非労働力人口の人数と、労働力人口比率・就業率・完全失業率を、年齢階級（15〜24 歳から 65 歳以上までの 10 歳刻み 6 区分と総数）別・男女別に持ちます。1 行が 1 年・男女・年齢階級・区分で、1997 年からです。

  - 年齢階級の「総数」は 15 歳以上の全体です。総数と年齢階級の和は、千人単位の丸めで 2 まで違います
  - 15 歳以上人口は就業状態不詳を含むので、労働力人口と非労働力人口の和より大きくなります
  - 同じ年の値は複数の年の表に載ります。値のある最も新しい年の表の値を使い、その表の年を report_year に入れています。基準人口を切り替えた 2012・2017・2022 年の表は、前年（2011・2016・2021 年）の値を新しい基準で計算し直しています。それより前の年は計算し直していないので、2010 年と 2011 年の間のように基準の違う年をまたぐ増減には、基準の差が含まれます
  - 就業率は 2008 年からです
  - 原典の 1997 年の 15 歳以上人口（総数）は男女計が 10,311 で、男と女の和（10,309）と 2 違います
