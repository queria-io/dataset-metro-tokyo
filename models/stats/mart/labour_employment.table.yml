schema: stats
name: labour_employment
title: 毎月勤労統計調査 常用労働者数・パートタイム労働者比率
description: '毎月勤労統計調査（地方調査）による東京都の常用労働者数（推計）とパートタイム労働者比率。

  1行 = 年 × 月（または年平均）× 事業所規模 × 産業で、2013年から各月と年平均を収録する。

  各年の値はその年の年報から取っている。事業所規模は5人以上と30人以上の2区分で、

  5人以上は30人以上の事業所を含むため、2区分を足さない。産業の区分は labour_earnings と同じで、

  2013年〜2016年は53区分、2017年は52区分、2018年からは17区分。年をまたいで産業を比べるときは

  industry_code でそろえる。原典で秘匿（×）または該当なし（－）の値は NULL。

  月次の行では 本月末労働者数 = 前月末労働者数 + 増加労働者数 − 減少労働者数 が成り立つ。

  男女の値は別に推計されているため、計が男と女の和と一致しない行がある。

  labour_earnings・labour_hours とは year・month・establishment_size・industry_code で結合できる。'
keywords:
  - 東京都
  - 毎月勤労統計
  - 雇用
  - 労働者数
  - パートタイム
  - 産業
  - 時系列
published: true
