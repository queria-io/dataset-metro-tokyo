  - name: category
    title: 分類
    description: 原典の〔〕の見出し。15 歳以上人口は「就業状態」に入れている
  - name: item
    title: 区分
    description: 原典の見出しを「／」でつないだもの。上位の区分を含む
  - name: sex
    title: 男女
    description: 男女計・男・女
  - name: unit
    title: 単位
    description: 千人または %
  - name: value
    title: 実数
  - name: previous_year_value
    title: 前年
    description: その年の表に載る前年の値。基準人口の切り替えや産業分類の改定があった年は、前年の表の実数と違う
  - name: change
    title: 対前年増減数
    description: 千人。率の区分はポイント
  - name: change_rate
    title: 対前年増減率
    description: ％。率の区分には無い
