schema: stats
name: labour_hours_by_employment_type
title: 毎月勤労統計調査 就業形態別月間出勤日数・実労働時間
description: '毎月勤労統計調査（地方調査）による東京都の常用労働者1人平均月間出勤日数・実労働時間を、

  一般労働者とパートタイム労働者に分けたもの。1行 = 年 × 月（または年平均）× 事業所規模 × 産業で、

  2013年から各月と年平均を収録する。各年の値はその年の年報から取っている。事業所規模は5人以上と

  30人以上の2区分で、5人以上は30人以上の事業所を含むため、2区分を足さない。産業は調査産業計（TL）と

  大分類の17区分（2017年は鉱業が無く16区分）で、labour_hours にある製造業の中分類・特掲産業は無い。

  就業形態を合わせた計の値は labour_hours にあり、year・month・establishment_size・industry_code で

  結合できる。labour_earnings_by_employment_type とも同じキーで結合でき、就業形態別の時間あたりの給与を

  求められる。原典で秘匿（×）または該当なし（－）の値は NULL。

  総実労働時間 = 所定内労働時間 + 所定外労働時間 が一般労働者・パートタイム労働者の全行で成り立つ。'
keywords:
  - 東京都
  - 毎月勤労統計
  - 労働時間
  - 残業
  - 出勤日数
  - パートタイム
  - 就業形態
  - 産業
  - 時系列
published: true
sources:
  - path: https://www.toukei.metro.tokyo.lg.jp/maikin/mk-index.htm
fields:
  - name: year
    title: 年
    description: 対象年（西暦）
  - name: period_type
    title: 期間区分
    description: 月次 / 年平均
  - name: month
    title: 月
    description: 対象月（1〜12）。年平均の行は NULL
  - name: establishment_size
    title: 事業所規模
    description: 5人以上 / 30人以上。5人以上は30人以上の事業所を含む
  - name: industry_code
    title: 産業符号
    description: 原典の産業符号。TL は調査産業計、英字1字は日本標準産業分類の大分類
  - name: industry_name
    title: 産業
  - name: general_days_worked
    title: 出勤日数（一般労働者）
    description: 一般労働者（常用労働者のうちパートタイム労働者以外の者）1人平均の月間出勤日数（日）。1時間でも就業すれば1日とする
  - name: general_total_hours
    title: 総実労働時間（一般労働者）
    description: 時間。所定内労働時間と所定外労働時間の合計
  - name: general_scheduled_hours
    title: 所定内労働時間（一般労働者）
    description: 事業所の就業規則で定められた正規の始業時刻と終業時刻の間の実労働時間（時間）
  - name: general_overtime_hours
    title: 所定外労働時間（一般労働者）
    description: 早出・残業・臨時の呼出・休日出勤などの実労働時間（時間）
  - name: part_time_days_worked
    title: 出勤日数（パートタイム労働者）
    description: パートタイム労働者（常用労働者のうち、1日の所定労働時間が一般の労働者より短い者、または1日の所定労働時間が同じで1週の所定労働日数が少ない者）1人平均の月間出勤日数（日）
  - name: part_time_total_hours
    title: 総実労働時間（パートタイム労働者）
    description: 時間。所定内労働時間と所定外労働時間の合計
  - name: part_time_scheduled_hours
    title: 所定内労働時間（パートタイム労働者）
    description: 時間
  - name: part_time_overtime_hours
    title: 所定外労働時間（パートタイム労働者）
    description: 時間
