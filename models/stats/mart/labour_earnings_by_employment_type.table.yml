schema: stats
name: labour_earnings_by_employment_type
title: 毎月勤労統計調査 就業形態別月間現金給与額
description: '毎月勤労統計調査（地方調査）による東京都の常用労働者1人平均月間現金給与額を、

  一般労働者とパートタイム労働者に分けたもの。1行 = 年 × 月（または年平均）× 事業所規模 × 産業で、

  2013年から各月と年平均を収録する。各年の値はその年の年報から取っている。事業所規模は5人以上と

  30人以上の2区分で、5人以上は30人以上の事業所を含むため、2区分を足さない。産業は調査産業計（TL）と

  大分類の17区分（2017年は鉱業が無く16区分）で、labour_earnings にある製造業の中分類・特掲産業は無い。

  就業形態を合わせた計の額は labour_earnings にあり、year・month・establishment_size・industry_code で

  結合できる。原典で秘匿（×）または該当なし（－）の値は NULL。

  現金給与総額 = きまって支給する給与 + 特別に支払われた給与、

  きまって支給する給与 = 所定内給与 + 所定外給与 が一般労働者・パートタイム労働者の全行で成り立つ。'
keywords:
  - 東京都
  - 毎月勤労統計
  - 賃金
  - 給与
  - パートタイム
  - 就業形態
  - 産業
  - 時系列
published: true
sources:
  - path: https://www.toukei.metro.tokyo.lg.jp/maikin/mk-index.htm
fields:
