title: 東京の労働力 主な職業別就業者数
description: |-
  労働力調査の東京都分を東京都が集計した「東京の労働力」の年平均の第 6 表です。就業者数を、専門的・技術的職業従事者・事務従事者・販売従事者・サービス職業従事者・生産工程従事者・運搬・清掃・包装等従事者・その他の 7 区分の職業別・男女別に持ちます。1 行が 1 年・男女・職業で、2010 年からです。

  - 7 区分の和は、labour_force の就業者数と千人単位の丸めの範囲（差 2 まで）で一致します。2011・2016・2021 年は labour_force の翌年の行の前年の値（previous_year_value）と比べてください。「その他」は原典の「その他（左記以外のもの）」で、ほかの 6 区分に入らない職業をまとめたものです
  - 同じ年の値は複数の年の表に載ります。値のある最も新しい年の表の値を使い、その表の年を report_year に入れています。2011・2016・2021 年の値は、基準人口を切り替えた翌年の表が新しい基準で計算し直した値です。2010 年の値は計算し直していないので、2010 年と 2011 年の間の増減には基準の差が含まれます
  - 男女計は男と女の和と、千人単位の丸めの範囲で一致します。「その他」だけは差が 3 までの年があります
