title: 東京の労働力 四半期別の就業状態別15歳以上人口
description: |-
  労働力調査の東京都分を東京都が集計した「東京の労働力」の四半期平均の第 2 表です。15 歳以上人口を就業状態（労働力人口・就業者・完全失業者・非労働力人口）で分けた人数（千人）と、労働力人口比率・就業率・完全失業率（％）を男女別に持ちます。1 行が 1 四半期・男女・区分で、1997 年 1〜3 月期からです。

  - 値は四半期（1〜3 月・4〜6 月・7〜9 月・10〜12 月）の平均です。季節調整はしていないので、四半期をまたぐ変化は前年同期と比べてください
  - 区分は原典の見出しを「／」でつないだもので、上位の区分を含みます。「15歳以上人口／労働力人口／就業者数」は労働力人口の内訳です。同じ四半期の区分を足さないでください。15 歳以上人口は就業状態不詳を含むので、労働力人口と非労働力人口の和とは一致しません（差は -1〜28 千人）
  - 同じ四半期の値は複数の表に載ります。値のある最も新しい表の値を使い、その表の年と四半期を report_year と report_quarter に入れています
  - 基準人口を切り替えた 2012 年 1〜3 月期・2017 年 1〜3 月期・2022 年 1〜3 月期の表は、直前の 4〜5 四半期（2011 年の 4 四半期、2015 年 10〜12 月期〜2016 年の 5 四半期、2020 年 10〜12 月期〜2021 年の 5 四半期）の値を新しい基準で計算し直しています。それより前の四半期は計算し直していないので、2010 年 10〜12 月期と 2011 年 1〜3 月期の間、2015 年 7〜9 月期と 10〜12 月期の間、2020 年 7〜9 月期と 10〜12 月期の間に基準の差が含まれます。2015 年と 2020 年は 4 四半期のうち最後の 1 つだけが新しい基準なので、4 四半期の平均は labour_force_activity の年平均と最大 19.75 千人ずれます。それ以外の年は差 1 千人以内で一致します
  - 就業率は 2011 年 7〜9 月期からです
  - 男女計は男と女の和、労働力人口は就業者数と完全失業者数の和と、千人単位の丸めの範囲（差 1 まで）で一致します。労働力人口比率と就業率は人数から計算した値と全行で一致します。完全失業率は完全失業者数と労働力人口から計算した値と 0.1 ポイント以内で一致します（2003 年 1〜3 月期の男は 174 ÷ 4,000 = 4.35 を原典が 4.4 としています）
