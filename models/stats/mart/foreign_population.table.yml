schema: stats
name: foreign_population
title: 国籍・地域別外国人人口
description: '東京都の国籍・地域別外国人人口の年次時系列。1行 = 年 × 地域 × 国籍・地域で、

  1979年から各年1月1日現在の値を収録する。地域は区市町村と島部の支庁に加えて

  総数・区部・市部・町村部・郡部・島部の集計行を含む。島部の町村は支庁単位でしか

  載らないため、都内を漏れなく分けるときは area_type in (''区市町村'', ''支庁'') で絞る。

  国籍・地域は総数・主要22か国・地域・その他の24区分で、総数の行を除いて足すと

  1990年まではドイツ（東西ドイツの合計）と東ドイツ・西ドイツが二重に数えられる。

  2016年までの「中国」は台湾を、「韓国・朝鮮」は韓国と朝鮮を合わせた区分で、

  2017年からは中国・台湾・韓国・朝鮮に分かれる（区分名に収録期間が付く）。

  2012年までは外国人登録者数、2013年からは住民基本台帳上の人口。'
keywords:
  - 東京都
  - 外国人
  - 国籍
  - 人口
  - 時系列
published: true
themes: [population, international]
sources:
  - path: https://catalog.data.metro.tokyo.lg.jp/organization/t000003
fields:
  - name: year
    title: 年
    description: 対象年（西暦）
  - name: as_of_date
    title: 現在日
    description: 集計時点（各年1月1日）
  - name: area_code
    title: 地域コード
    description: 全国地方公共団体コードの上5桁。集計行と支庁は都が付す地域コード（総数13000・区部13100・大島支庁13360など）
    semantic: { role: entity, name: city }
  - name: area_name
    title: 地域
  - name: area_type
    title: 地域区分
    description: 総数 / 地域区分（区部・市部・町村部・郡部・島部）/ 支庁 / 区市町村。地域コードから導出
  - name: nationality
    title: 国籍・地域
    description: 原典の区分名。総数・その他を含む24区分。中国・韓国などは区分の変わった年が名前に付く（例 中国（平成29年から））
  - name: population
    title: 外国人人口
    description: 2012年までは外国人登録者数、2013年からは住民基本台帳上の人口（人）
