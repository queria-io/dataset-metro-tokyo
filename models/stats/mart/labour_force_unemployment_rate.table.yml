schema: stats
name: labour_force_unemployment_rate
title: 東京の労働力 東京都・南関東・全国の完全失業率
description: |-
  労働力調査の東京都分を東京都が集計した「東京の労働力」の年平均に付く参考表です。東京都・南関東・全国の完全失業率を男女別に持ちます。1 行が 1 年・地域・男女で、1997 年からです。

  - 南関東は埼玉県・千葉県・東京都・神奈川県です
  - 同じ年の値は複数の年の表に載ります。最も新しい年の表の値を使い、その表の年を report_year に入れています。2011 年と 2016 年の一部の値は、その年の表と後の年の表とで違います
keywords:
