schema: stats
name: labour_earnings
title: 毎月勤労統計調査 月間現金給与額
description: |-
  毎月勤労統計調査（地方調査）の、東京都の常用労働者 1 人平均の月間現金給与額です。1 行が 1 年・月（または年平均）・事業所規模・産業で、2013 年からです。

  - 事業所規模の「5人以上」は「30人以上」の事業所を含みます。2 つの区分を足さないでください
  - 産業の区分は 2018 年から 17 区分に減りました。年をまたいで比べるときは `industry_code` で揃えてください
keywords:
  - 東京都
  - 毎月勤労統計
  - 賃金
  - 給与
  - 賞与
  - 産業
  - 時系列
sources:
  - path: https://www.toukei.metro.tokyo.lg.jp/maikin/mk-index.htm
fields:
  - name: year
    title: 年
    description: 対象年（西暦）
  - name: period_type
    title: 期間区分
    description: 月次 / 年平均
  - name: month
    title: 月
    description: 対象月（1〜12）。年平均の行は NULL
  - name: establishment_size
    title: 事業所規模
    description: 5人以上 / 30人以上。5人以上は30人以上の事業所を含む
  - name: industry_code
    title: 産業符号
    description: 原典の産業符号。TL は調査産業計、英字 1 字は大分類
  - name: industry_name
    title: 産業
  - name: cash_earnings
    title: 現金給与総額
    description: 1 人平均の月間現金給与総額（円）。税・社会保険料を引く前の額
  - name: cash_earnings_male
    title: 現金給与総額（男）
    description: 円
  - name: cash_earnings_female
    title: 現金給与総額（女）
    description: 円
  - name: contractual_earnings
    title: きまって支給する給与
    description: きまって支給する給与（円）。所定内給与と所定外給与の合計
  - name: contractual_earnings_male
    title: きまって支給する給与（男）
    description: 円
  - name: contractual_earnings_female
    title: きまって支給する給与（女）
    description: 円
  - name: scheduled_earnings
    title: 所定内給与
    description: きまって支給する給与のうち所定外給与以外のもの（円）
  - name: overtime_earnings
    title: 所定外給与
    description: 時間外・休日・深夜の労働に支給される給与（円）
  - name: special_earnings
    title: 特別に支払われた給与
    description: 賞与など、一時的・突発的な理由で支払われた給与（円）
  - name: special_earnings_male
    title: 特別に支払われた給与（男）
    description: 円
  - name: special_earnings_female
    title: 特別に支払われた給与（女）
    description: 円
annotations:
  queria:
    themes: [labour]
