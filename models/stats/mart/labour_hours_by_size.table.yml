    description: 時間
  - name: overtime_hours
    title: 所定外労働時間
    description: 早出・残業・臨時の呼出・休日出勤などの実労働時間（時間）
  - name: overtime_hours_male
    title: 所定外労働時間（男）
    description: 時間
  - name: overtime_hours_female
    title: 所定外労働時間（女）
    description: 時間
