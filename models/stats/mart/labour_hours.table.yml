schema: stats
name: labour_hours
title: 毎月勤労統計調査 月間出勤日数・実労働時間
description: '毎月勤労統計調査（地方調査）による東京都の常用労働者1人平均月間出勤日数・実労働時間。

  1行 = 年 × 月（または年平均）× 事業所規模 × 産業で、2013年から各月と年平均を収録する。

  各年の値はその年の年報から取っている。事業所規模は5人以上と30人以上の2区分で、

  5人以上は30人以上の事業所を含むため、2区分を足さない。産業の区分は labour_earnings と同じで、

  2013年〜2016年は53区分、2017年は52区分、2018年からは17区分。年をまたいで産業を比べるときは

  industry_code でそろえる。原典で秘匿（×）または該当なし（－）の値は NULL。

  総実労働時間 = 所定内労働時間 + 所定外労働時間 が全行で成り立つ。

  labour_earnings とは year・month・establishment_size・industry_code で結合でき、

  時間あたりの給与を求められる。'
keywords:
  - 東京都
  - 毎月勤労統計
  - 労働時間
  - 残業
  - 出勤日数
  - 産業
  - 時系列
published: true
sources:
  - path: https://www.toukei.metro.tokyo.lg.jp/maikin/mk-index.htm
fields:
  - name: year
    title: 年
    description: 対象年（西暦）
  - name: period_type
    title: 期間区分
    description: 月次 / 年平均
  - name: month
    title: 月
    description: 対象月（1〜12）。年平均の行は NULL
  - name: establishment_size
    title: 事業所規模
    description: 5人以上 / 30人以上。5人以上は30人以上の事業所を含む
  - name: industry_code
    title: 産業符号
    description: 原典の産業符号。TL は調査産業計、英字1字は日本標準産業分類の大分類、TK・TT は都が定める特掲産業
  - name: industry_name
    title: 産業
  - name: days_worked
    title: 出勤日数
    description: 常用労働者1人平均の月間出勤日数（日）。業務のため実際に出勤した日数で、1時間でも就業すれば1日とする
  - name: days_worked_male
    title: 出勤日数（男）
    description: 日
  - name: days_worked_female
    title: 出勤日数（女）
    description: 日
  - name: total_hours
    title: 総実労働時間
    description: 常用労働者1人平均の月間総実労働時間（時間）。所定内労働時間と所定外労働時間の合計
  - name: total_hours_male
    title: 総実労働時間（男）
    description: 時間
  - name: total_hours_female
    title: 総実労働時間（女）
    description: 時間
  - name: scheduled_hours
    title: 所定内労働時間
    description: 事業所の就業規則で定められた正規の始業時刻と終業時刻の間の実労働時間（時間）
  - name: scheduled_hours_male
    title: 所定内労働時間（男）
    description: 時間
  - name: scheduled_hours_female
    title: 所定内労働時間（女）
    description: 時間
  - name: overtime_hours
    title: 所定外労働時間
    description: 早出・残業・臨時の呼出・休日出勤などの実労働時間（時間）
  - name: overtime_hours_male
    title: 所定外労働時間（男）
    description: 時間
  - name: overtime_hours_female
    title: 所定外労働時間（女）
    description: 時間
