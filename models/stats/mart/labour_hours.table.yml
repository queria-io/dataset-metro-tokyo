schema: stats
name: labour_hours
title: 毎月勤労統計調査 月間出勤日数・実労働時間
description: |-
  毎月勤労統計調査（地方調査）の、東京都の常用労働者 1 人平均の月間出勤日数と実労働時間です。1 行が 1 年・月（または年平均）・事業所規模・産業で、2013 年からです。

  - 事業所規模の「5人以上」は「30人以上」の事業所を含みます。2 つの区分を足さないでください
  - 産業の区分は 2018 年から 17 区分に減りました。年をまたいで比べるときは `industry_code` で揃えてください
keywords:
  - 東京都
  - 毎月勤労統計
  - 労働時間
  - 残業
  - 出勤日数
  - 産業
  - 時系列
sources:
  - path: https://www.toukei.metro.tokyo.lg.jp/maikin/mk-index.htm
fields:
  - name: year
    title: 年
    description: 対象年（西暦）
  - name: period_type
    title: 期間区分
    description: 月次 / 年平均
  - name: month
    title: 月
    description: 対象月（1〜12）。年平均の行は NULL
  - name: establishment_size
    title: 事業所規模
    description: 5人以上 / 30人以上。5人以上は30人以上の事業所を含む
  - name: industry_code
    title: 産業符号
    description: 原典の産業符号。TL は調査産業計、英字 1 字は大分類
  - name: industry_name
    title: 産業
  - name: days_worked
    title: 出勤日数
    description: 1 人平均の月間出勤日数（日）。1 時間でも就業すれば 1 日
  - name: days_worked_male
    title: 出勤日数（男）
    description: 日
  - name: days_worked_female
    title: 出勤日数（女）
    description: 日
  - name: total_hours
    title: 総実労働時間
    description: 常用労働者1人平均の月間総実労働時間（時間）。所定内労働時間と所定外労働時間の合計
  - name: total_hours_male
    title: 総実労働時間（男）
    description: 時間
  - name: total_hours_female
    title: 総実労働時間（女）
    description: 時間
  - name: scheduled_hours
    title: 所定内労働時間
    description: 事業所の就業規則で定められた正規の始業時刻と終業時刻の間の実労働時間（時間）
  - name: scheduled_hours_male
    title: 所定内労働時間（男）
    description: 時間
  - name: scheduled_hours_female
    title: 所定内労働時間（女）
    description: 時間
  - name: overtime_hours
    title: 所定外労働時間
    description: 早出・残業・臨時の呼出・休日出勤などの実労働時間（時間）
  - name: overtime_hours_male
    title: 所定外労働時間（男）
    description: 時間
  - name: overtime_hours_female
    title: 所定外労働時間（女）
    description: 時間
annotations:
  queria:
    themes: [labour]
