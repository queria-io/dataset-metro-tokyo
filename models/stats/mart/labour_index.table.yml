schema: stats
name: labour_index
title: 毎月勤労統計調査 規模・産業別の賃金・労働時間・雇用指数
description: |-
  毎月勤労統計調査（地方調査）の、東京都の名目賃金指数・実質賃金指数・労働時間指数・常用雇用指数です。1 行が 1 指数・年・月（または年平均）・事業所規模・産業で、2013 年からです。

  - 指数の種類は 9 つです。名目賃金指数（現金給与総額・きまって支給する給与・所定内給与）、実質賃金指数（現金給与総額・きまって支給する給与）、労働時間指数（総実労働時間・所定内労働時間・所定外労働時間）、常用雇用指数
  - 指数の基準年は年によって違います（2013〜2016 年は 2010 年、2017〜2021 年は 2015 年、2022 年からは 2020 年を 100 とする）。基準年が違う年の指数どうしは比べられません。年をまたぐ変化は前年比・前年同月比を使ってください
  - 実質賃金指数は、名目賃金指数を東京都区部の消費者物価指数（帰属家賃を除く総合。年報によっては持家の帰属家賃を除く総合）で割った値です
  - 前年比・前年同月比は原典の値です。2024 年からは前年の値をベンチマーク更新後の参考値に置き換えて計算されているため、指数から計算した値と一致しません
  - 事業所規模の「5人以上」は「30人以上」の事業所を含みます
  - 産業は調査産業計と大分類の 17 区分です（2017〜2021 年は鉱業が無く 16 区分）
keywords:
  - 東京都
  - 毎月勤労統計
  - 賃金指数
  - 実質賃金
  - 労働時間指数
  - 常用雇用指数
  - 産業
  - 時系列
published: true
themes: [labour]
sources:
  - path: https://www.toukei.metro.tokyo.lg.jp/maikin/mk-index.htm
fields:
  - name: index_type
    title: 指数の種類
    description: 名目賃金指数（現金給与総額）/ 名目賃金指数（きまって支給する給与）/ 名目賃金指数（所定内給与）/ 実質賃金指数（現金給与総額）/ 実質賃金指数（きまって支給する給与）/ 労働時間指数（総実労働時間）/ 労働時間指数（所定内労働時間）/ 労働時間指数（所定外労働時間）/ 常用雇用指数
  - name: year
    title: 年
    description: 対象年（西暦）
  - name: period_type
    title: 期間区分
    description: 月次 / 年平均
  - name: month
    title: 月
    description: 対象月（1〜12）。年平均の行は NULL
  - name: establishment_size
    title: 事業所規模
    description: 5人以上 / 30人以上。5人以上は30人以上の事業所を含む
  - name: industry_code
    title: 産業符号
    description: 原典の産業符号。TL は調査産業計、英字 1 字は大分類。labour_employment の産業符号と同じ
  - name: industry_name
    title: 産業
  - name: base_year
    title: 基準年
    description: 指数を 100 とする年（その年の平均）。2010 / 2015 / 2020
  - name: index_value
    title: 指数
    description: 基準年の平均を 100 とする指数
  - name: change_rate
    title: 前年比・前年同月比
    description: 年平均の行は前年比、月次の行は前年同月比（％）。基準年の切り替えをまたいでも比べられるように原典が計算した値
