schema: stats
name: labour_force_activity
title: 東京の労働力 就業状態・活動状態別15歳以上人口
description: |-
  労働力調査の東京都分を東京都が集計した「東京の労働力」の年平均の第 2 表です。15 歳以上人口を就業状態（労働力人口・就業者・完全失業者・非労働力人口）、就業者の活動状態（主に仕事・通学のかたわらに仕事・家事などのかたわらに仕事・休業者）、従業上の地位（自営業主・家族従業者・雇用者）、非労働力人口の活動状態（通学・家事・その他）で分けた人数と、労働力人口比率・就業率・完全失業率を男女別に持ちます。1 行が 1 年・男女・区分で、1997 年からです。

  - 区分は原典の見出しを「／」でつないだもので、上位の区分を含みます。「15歳以上人口／労働力人口／就業者数」は労働力人口の内訳です。同じ年の区分を足さないでください
  - 15 歳以上人口は就業状態不詳を含むので、労働力人口と非労働力人口の和より大きくなります
  - 同じ年の値は複数の年の表に載ります。値のある最も新しい年の表の値を使い、その表の年を report_year に入れています。基準人口を切り替えた 2012・2017・2022 年の表は、前年（2011・2016・2021 年）の値を新しい基準で計算し直しています。それより前の年は計算し直していないので、2010 年と 2011 年の間のように基準の違う年をまたぐ増減には、基準の差が含まれます
  - 就業率は 2008 年から、正規・非正規の職員・従業員は 2013 年から、雇用者のうち常雇は 2017 年までです
  - 原典の 1997 年の男女計の「非労働力人口／その他」は 922 で、男と女の和（992）と合いません
