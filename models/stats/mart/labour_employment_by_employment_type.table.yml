schema: stats
name: labour_employment_by_employment_type
title: 毎月勤労統計調査 就業形態別常用労働者数
description: '毎月勤労統計調査（地方調査）による東京都の常用労働者数（推計）を、一般労働者とパートタイム労働者に

  分けたもの。1行 = 年 × 月（または年平均）× 事業所規模 × 産業で、2013年から各月と年平均を収録する。

  各年の値はその年の年報から取っている。事業所規模は5人以上と30人以上の2区分で、5人以上は30人以上の

  事業所を含むため、2区分を足さない。産業は調査産業計（TL）と大分類の17区分（2017年は鉱業が無く16区分）で、

  labour_employment にある製造業の中分類・特掲産業は無い。2016年の5人以上の鉱業は原典で年平均・月が

  空欄のため収録しない。原典で秘匿（×）または該当なし（－）の値は NULL。

  一般労働者とパートタイム労働者の本月末労働者数の和は labour_employment の本月末労働者数と全行で一致し、

  year・month・establishment_size・industry_code で結合できる。月次の行で

  本月末労働者数 = 前月末労働者数 + 増加労働者数 − 減少労働者数 が成り立つのは2つの就業形態を合わせた値で、

  就業形態ごとには成り立たない。その差は一般労働者とパートタイム労働者で大きさが同じで符号が逆になる。'
keywords:
  - 東京都
  - 毎月勤労統計
  - 雇用
  - 労働者数
  - パートタイム
  - 就業形態
  - 産業
  - 時系列
published: true
sources:
  - path: https://www.toukei.metro.tokyo.lg.jp/maikin/mk-index.htm
fields:
  - name: year
    title: 年
    description: 対象年（西暦）
  - name: period_type
    title: 期間区分
    description: 月次 / 年平均
  - name: month
    title: 月
    description: 対象月（1〜12）。年平均の行は NULL
  - name: establishment_size
    title: 事業所規模
    description: 5人以上 / 30人以上。5人以上は30人以上の事業所を含む
  - name: industry_code
    title: 産業符号
    description: 原典の産業符号。TL は調査産業計、英字1字は日本標準産業分類の大分類
  - name: industry_name
    title: 産業
  - name: general_employees_start
    title: 前月末労働者数（一般労働者）
    description: 一般労働者（常用労働者のうちパートタイム労働者以外の者）の前月末の人数の推計（人）。年平均の行は各月の平均
  - name: general_employees_added
    title: 増加労働者数（一般労働者）
    description: 本月中に増えた一般労働者数（人）。年平均の行は各月の平均
  - name: general_employees_removed
    title: 減少労働者数（一般労働者）
    description: 本月中に減った一般労働者数（人）。年平均の行は各月の平均
  - name: general_employees
    title: 本月末労働者数（一般労働者）
    description: 一般労働者の本月末の人数の推計（人）。年平均の行は各月の平均
  - name: part_time_employees_start
    title: 前月末労働者数（パートタイム労働者）
    description: パートタイム労働者（常用労働者のうち、1日の所定労働時間が一般の労働者より短い者、または1日の所定労働時間が同じで1週の所定労働日数が少ない者）の前月末の人数の推計（人）。年平均の行は各月の平均
  - name: part_time_employees_added
    title: 増加労働者数（パートタイム労働者）
    description: 人
  - name: part_time_employees_removed
    title: 減少労働者数（パートタイム労働者）
    description: 人
  - name: part_time_employees
    title: 本月末労働者数（パートタイム労働者）
    description: 人
