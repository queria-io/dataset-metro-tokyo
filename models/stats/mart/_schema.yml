version: 2

models:
  - name: resident_population
    description: |
      東京都の住民基本台帳による世帯数と人口の月次時系列。1行 = 月 × 地域で、
      2001年1月分から毎月1日現在の値を収録する。地域は区市町村（62）に加えて
      総数・区部・市部・町村部・郡部・島部・支庁の集計行を含むため、区市町村だけを
      見るときは area_type = '区市町村' で絞る。地域コードは全国地方公共団体コードの
      上5桁で、census・boundary・lg_code と直結する。
      外国人人口は2012年7月分までが外国人登録者数、2012年8月分以降が住民基本台帳上の
      人口で、世帯数もこのとき外国人世帯を含むようになった。7月分と8月分の間の増減は
      この制度変更を含むため、そのまま人口動態として読まない。
      外国人の男女別人口と世帯数の国籍別内訳は原典の様式追加により2012年9月分以降のみで、
      それ以前は NULL。
    access: public
    columns:
      - name: year_month
      - name: as_of_date
      - name: area_code
      - name: area_name
      - name: area_type
      - name: population_total
      - name: population_change
      - name: japanese_total
      - name: japanese_male
      - name: japanese_female
      - name: foreign_total
      - name: foreign_male
      - name: foreign_female
      - name: household_total
      - name: household_japanese_only
      - name: household_foreign_only
      - name: household_mixed
  - name: foreign_population
    description: |
      東京都の国籍・地域別外国人人口の年次時系列。1行 = 年 × 地域 × 国籍・地域で、
      1979年から各年1月1日現在の値を収録する。地域は区市町村と島部の支庁に加えて
      総数・区部・市部・町村部・郡部・島部の集計行を含む。島部の町村は支庁単位でしか
      載らないため、都内を漏れなく分けるときは area_type in ('区市町村', '支庁') で絞る。
      国籍・地域は総数・主要22か国・地域・その他の24区分で、総数の行を除いて足すと
      1990年まではドイツ（東西ドイツの合計）と東ドイツ・西ドイツが二重に数えられる。
      2016年までの「中国」は台湾を、「韓国・朝鮮」は韓国と朝鮮を合わせた区分で、
      2017年からは中国・台湾・韓国・朝鮮に分かれる（区分名に収録期間が付く）。
      2012年までは外国人登録者数、2013年からは住民基本台帳上の人口。
    access: public
    columns:
      - name: year
      - name: as_of_date
      - name: area_code
      - name: area_name
      - name: area_type
      - name: nationality
      - name: population
