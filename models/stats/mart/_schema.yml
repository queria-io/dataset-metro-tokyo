version: 2

models:
  - name: resident_population
    description: |
      東京都の住民基本台帳による世帯数と人口の月次時系列。1行 = 月 × 地域で、
      2001年1月分から毎月1日現在の値を収録する。地域は区市町村（62）に加えて
      総数・区部・市部・町村部・郡部・島部・支庁の集計行を含むため、区市町村だけを
      見るときは area_type = '区市町村' で絞る。地域コードは全国地方公共団体コードの
      上5桁で、census・boundary・lg_code と直結する。
      外国人人口は2012年7月分までが外国人登録者数、2012年8月分以降が住民基本台帳上の
      人口で、世帯数もこのとき外国人世帯を含むようになった。7月分と8月分の間の増減は
      この制度変更を含むため、そのまま人口動態として読まない。
      外国人の男女別人口と世帯数の国籍別内訳は原典の様式追加により2012年9月分以降のみで、
      それ以前は NULL。
    access: public
    columns:
      - name: year_month
      - name: as_of_date
      - name: area_code
      - name: area_name
      - name: area_type
      - name: population_total
      - name: population_change
      - name: japanese_total
      - name: japanese_male
      - name: japanese_female
      - name: foreign_total
      - name: foreign_male
      - name: foreign_female
      - name: household_total
      - name: household_japanese_only
      - name: household_foreign_only
      - name: household_mixed
  - name: foreign_population
    description: |
      東京都の国籍・地域別外国人人口の年次時系列。1行 = 年 × 地域 × 国籍・地域で、
      1979年から各年1月1日現在の値を収録する。地域は区市町村と島部の支庁に加えて
      総数・区部・市部・町村部・郡部・島部の集計行を含む。島部の町村は支庁単位でしか
      載らないため、都内を漏れなく分けるときは area_type in ('区市町村', '支庁') で絞る。
      国籍・地域は総数・主要22か国・地域・その他の24区分で、総数の行を除いて足すと
      1990年まではドイツ（東西ドイツの合計）と東ドイツ・西ドイツが二重に数えられる。
      2016年までの「中国」は台湾を、「韓国・朝鮮」は韓国と朝鮮を合わせた区分で、
      2017年からは中国・台湾・韓国・朝鮮に分かれる（区分名に収録期間が付く）。
      2012年までは外国人登録者数、2013年からは住民基本台帳上の人口。
    access: public
    columns:
      - name: year
      - name: as_of_date
      - name: area_code
      - name: area_name
      - name: area_type
      - name: nationality
      - name: population
  - name: labour_earnings
    description: |
      毎月勤労統計調査（地方調査）による東京都の常用労働者1人平均月間現金給与額。
      1行 = 年 × 月（または年平均）× 事業所規模 × 産業で、2013年から各月と年平均を収録する。
      各年の値はその年の年報から取っている。事業所規模は5人以上と30人以上の2区分で、
      5人以上は30人以上の事業所を含むため、2区分を足さない。産業は2017年までは
      製造業の中分類・特掲産業などを含み、2018年からは調査産業計と大分類の17区分。
      原典で秘匿（×）または該当なし（－）の値は NULL。
    access: public
    columns:
      - name: year
      - name: period_type
      - name: month
      - name: establishment_size
      - name: industry_code
      - name: industry_name
      - name: cash_earnings
      - name: cash_earnings_male
      - name: cash_earnings_female
      - name: contractual_earnings
      - name: contractual_earnings_male
      - name: contractual_earnings_female
      - name: scheduled_earnings
      - name: overtime_earnings
      - name: special_earnings
      - name: special_earnings_male
      - name: special_earnings_female
  - name: labour_hours
    description: |
      毎月勤労統計調査（地方調査）による東京都の常用労働者1人平均月間出勤日数・実労働時間。
      1行 = 年 × 月（または年平均）× 事業所規模 × 産業で、2013年から各月と年平均を収録する。
      各年の値はその年の年報から取っている。事業所規模・産業の区分は labour_earnings と同じで、
      5人以上は30人以上の事業所を含むため、2区分を足さない。
      原典で秘匿（×）または該当なし（－）の値は NULL。
    access: public
    columns:
      - name: year
      - name: period_type
      - name: month
      - name: establishment_size
      - name: industry_code
      - name: industry_name
      - name: days_worked
      - name: days_worked_male
      - name: days_worked_female
      - name: total_hours
      - name: total_hours_male
      - name: total_hours_female
      - name: scheduled_hours
      - name: scheduled_hours_male
      - name: scheduled_hours_female
      - name: overtime_hours
      - name: overtime_hours_male
      - name: overtime_hours_female
  - name: labour_employment
    description: |
      毎月勤労統計調査（地方調査）による東京都の常用労働者数（推計）とパートタイム労働者比率。
      1行 = 年 × 月（または年平均）× 事業所規模 × 産業で、2013年から各月と年平均を収録する。
      各年の値はその年の年報から取っている。事業所規模・産業の区分は labour_earnings と同じで、
      5人以上は30人以上の事業所を含むため、2区分を足さない。
      原典で秘匿（×）または該当なし（－）の値は NULL。
    access: public
    columns:
      - name: year
      - name: period_type
      - name: month
      - name: establishment_size
      - name: industry_code
      - name: industry_name
      - name: employees_start
      - name: employees_start_male
      - name: employees_start_female
      - name: employees_added
      - name: employees_added_male
      - name: employees_added_female
      - name: employees_removed
