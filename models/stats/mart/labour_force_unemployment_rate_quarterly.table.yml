schema: stats
name: labour_force_unemployment_rate_quarterly
title: 東京の労働力 東京都・南関東・全国の完全失業率（四半期）
description: |-
  労働力調査の東京都分を東京都が集計した「東京の労働力」の四半期平均に付く参考表です。東京都・南関東・全国の完全失業率を男女別に持ちます。1 行が 1 四半期・地域・男女で、1997 年 1〜3 月期からです。

  - 季節調整をしていない原数値です。四半期をまたぐ変化は前年同期との比較で見てください
  - 南関東は埼玉県・千葉県・東京都・神奈川県です
  - 同じ四半期の値は複数の表に載ります。最も新しい表の値を使い、その表の年と四半期を report_year・report_quarter に入れています
keywords:
