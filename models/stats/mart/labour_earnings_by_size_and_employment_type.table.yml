schema: stats
name: labour_earnings_by_size_and_employment_type
title: 毎月勤労統計調査 規模・就業形態別月間現金給与額
description: '毎月勤労統計調査（地方調査）による東京都の常用労働者1人平均月間現金給与額を、

  事業所規模別に、一般労働者とパートタイム労働者に分けたもの。1行 = 年 × 月（または年平均）× 事業所規模で、

  2013年から各月と年平均を収録する。各年の値はその年の年報から取っている。産業は調査産業計だけで、

  事業所規模は5〜29人・30〜99人・100〜499人・500人以上の4区分。区分は重ならない。

  就業形態を合わせた計の額は labour_earnings_by_size にあり、year・month・establishment_size で結合できる。

  現金給与総額 = きまって支給する給与 + 特別に支払われた給与、

  きまって支給する給与 = 所定内給与 + 所定外給与 が一般労働者・パートタイム労働者の全行で成り立つ。'
keywords:
  - 東京都
  - 毎月勤労統計
  - 賃金
  - 給与
  - パートタイム
  - 就業形態
  - 事業所規模
  - 時系列
published: true
themes: [labour]
sources:
  - path: https://www.toukei.metro.tokyo.lg.jp/maikin/mk-index.htm
