version: 2

models:
  - name: raw_resident_population
    description: |
      東京都「住民基本台帳による世帯と人口」（月次）の生データ。全列 VARCHAR で取り込む。
      2012年8月分までと2012年9月分以降で原典の様式が違うため、パイプラインが共通キーに
      割り当てたうえで出力する（旧様式に無い列は NULL）。
  - name: raw_resident_population_source
    description: 住民基本台帳による世帯と人口の取得元（1行=1月分）。取り込んだ月・URL・行数を記録する。
  - name: raw_foreign_population
    description: |
      東京都「外国人人口」時系列（各年1月1日現在）の生データ。全列 VARCHAR で取り込む。
      原典の横持ち（列 = 和暦の年）をパイプラインが 国籍・地域 × 地域 × 年 の縦持ちに直し、
      値の無い年（国籍・地域の区分が無い年）の行は出力しない。
  - name: raw_foreign_population_source
    description: 外国人人口の取得元（1行=1ファイル）。取得元 URL・取得時刻・行数を記録する。
  - name: raw_labour_earnings
    description: |
      毎月勤労統計調査（東京都）年報の第1-1表・第1-2表の生データ。全列 VARCHAR で取り込む。
      各年の年報から公表年の行（各月と年平均）だけを取り出し、過去年の年平均の行は出力しない。
  - name: raw_labour_earnings_source
    description: 毎月勤労統計調査の取得元（1行=1ファイル）。年報の年・表・取得元 URL・取得時刻・行数を記録する。
  - name: raw_labour_hours
    description: |
      毎月勤労統計調査（東京都）年報の第6-1表・第6-2表の生データ。全列 VARCHAR で取り込む。
      各年の年報から公表年の行（各月と年平均）だけを取り出し、過去年の年平均の行は出力しない。
  - name: raw_labour_hours_source
    description: 毎月勤労統計調査（月間出勤日数・実労働時間）の取得元（1行=1ファイル）。年報の年・表・取得元 URL・取得時刻・行数を記録する。
  - name: raw_labour_employment
    description: |
      毎月勤労統計調査（東京都）年報の第10-1表・第10-2表の生データ。全列 VARCHAR で取り込む。
      各年の年報から公表年の行（各月と年平均）だけを取り出し、過去年の年平均の行は出力しない。
  - name: raw_labour_employment_source
    description: 毎月勤労統計調査（常用労働者数・パートタイム労働者比率）の取得元（1行=1ファイル）。年報の年・表・取得元 URL・取得時刻・行数を記録する。
  - name: raw_labour_earnings_by_employment_type
    description: |
      毎月勤労統計調査（東京都）年報の第2-1表・第2-2表の生データ。全列 VARCHAR で取り込む。
      各年の年報から公表年の行（各月と年平均）だけを取り出し、過去年の年平均の行は出力しない。
  - name: raw_labour_earnings_by_employment_type_source
    description: 毎月勤労統計調査（就業形態別月間現金給与額）の取得元（1行=1ファイル）。年報の年・表・取得元 URL・取得時刻・行数を記録する。
  - name: raw_labour_hours_by_employment_type
    description: |
      毎月勤労統計調査（東京都）年報の第7-1表・第7-2表の生データ。全列 VARCHAR で取り込む。
      各年の年報から公表年の行（各月と年平均）だけを取り出し、過去年の年平均の行は出力しない。
  - name: raw_labour_hours_by_employment_type_source
    description: 毎月勤労統計調査（就業形態別月間出勤日数・実労働時間）の取得元（1行=1ファイル）。年報の年・表・取得元 URL・取得時刻・行数を記録する。
  - name: raw_labour_employment_by_employment_type
    description: |
      毎月勤労統計調査（東京都）年報の第11-1表・第11-2表の生データ。全列 VARCHAR で取り込む。
      各年の年報から公表年の行（各月と年平均）だけを取り出し、過去年の年平均の行は出力しない。
  - name: raw_labour_employment_by_employment_type_source
    description: 毎月勤労統計調査（就業形態別常用労働者数）の取得元（1行=1ファイル）。年報の年・表・取得元 URL・取得時刻・行数を記録する。
