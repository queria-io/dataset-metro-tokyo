version: 2

models:
  - name: stg_resident_population
    description: |
      住民基本台帳による世帯と人口のステージング。人口・世帯数を INTEGER に型変換し
      （原典の '-' は NULL）、月初日を DATE で付与する。2回現れる集計行を 月 × 地域コード で
      1行にまとめ、2001年分の西多摩郡4町村の地域コードのずれを原典の現行コードに直し、
      年により番号体系が変わる「地域階層」の代わりに地域コードから区分を導出する。
  - name: stg_foreign_population
    description: |
      外国人人口のステージング。人口を INTEGER に型変換し（原典は年により桁区切りのカンマを含む）、
      現在日（各年1月1日）を DATE で付与し、地域コードから区分を導出する。
  - name: stg_labour_earnings
    description: |
      毎月勤労統計調査（月間現金給与額）のステージング。金額を INTEGER に型変換し（「×」と「－」は NULL）、
      「年平均・月」を月の番号に直し、産業を符号と名前に分ける。
