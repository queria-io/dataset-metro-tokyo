version: 2

models:
  - name: stg_datasets
    description: データセットメタデータのステージング。列名を英語化し、extras から更新頻度を抽出、日時を TIMESTAMP 化。
  - name: stg_resources
    description: リソースのステージング。resources JSON 配列を1行=1リソースに展開して型変換。
  - name: stg_dataset_tags
    description: データセットとタグの対応のステージング。
  - name: stg_dataset_groups
    description: データセットとグループの対応のステージング。
  - name: stg_organizations
    description: 提供組織のステージング。組織コードから組織種別を導出。
  - name: stg_groups
    description: グループ（分野分類）のステージング。
