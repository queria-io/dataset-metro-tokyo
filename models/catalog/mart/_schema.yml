version: 2

models:
  - name: datasets
    access: public
    columns:
      - name: package_id
      - name: dataset_code
      - name: title
      - name: description
      - name: organization_code
      - name: organization_title
      - name: license_id
      - name: license_title
      - name: maintainer
      - name: update_frequency
      - name: num_resources
      - name: metadata_created
      - name: metadata_modified
      - name: portal_url

  - name: resources
    access: public
    columns:
      - name: resource_id
      - name: package_id
      - name: name
      - name: description
      - name: format
      - name: url
      - name: mimetype
      - name: size_bytes
      - name: created
      - name: last_modified
      - name: resource_position

  - name: organizations
    access: public
    columns:
      - name: organization_code
      - name: title
      - name: organization_type
      - name: description
      - name: dataset_count

  - name: groups
    access: public
    columns:
      - name: group_code
      - name: title
      - name: description
      - name: dataset_count

  - name: dataset_tags
    access: public
    columns:
      - name: package_id
      - name: tag

  - name: dataset_groups
    access: public
    columns:
      - name: package_id
      - name: group_code
