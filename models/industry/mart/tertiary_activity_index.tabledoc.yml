title: 東京都第3次産業活動指数（月次）
description: |-
  東京都総務局統計部が公表する第3次産業活動指数（平成27年=100）の月次です。電気・ガス・熱供給・水道業、情報通信業、運輸業、卸売・小売業、金融・保険業、不動産業、サービス業などの業種別に、原指数と季節調整済指数を持ちます。1 行が 1 か月・業種・指数の種類で、2013 年 1 月からです。

  - index_type は original（原指数）と seasonally_adjusted（季節調整済指数）です。月ごとの変化を見るときは季節調整済、前年同月と比べるときは原指数を使います
  - item_class は品目の階層です。0 は第3次産業総合、1〜5 は大分類・中分類・小分類・細分類・細々分類で、11・12 は原典の再編集系列です。階層をまたいで足すと二重に数えます
  - weight は第3次産業総合を 10000 としたウェイトです
  - 業種の系列がまだ無い月の index_value は空です
topics:
