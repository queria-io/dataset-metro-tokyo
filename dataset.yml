# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・AI 向けの説明）は annotations.queria に書く。
name: metro_tokyo
title: 東京都オープンデータカタログ
description: |-
  東京都オープンデータカタログのデータセットの一覧と、都内の区市町村が公開する自治体標準オープンデータセット（AED・避難場所・公共施設など 22 種類）を統合したものです。都の保育所・児童館、保健所台帳、住民基本台帳の人口、毎月勤労統計調査、区市町村の調達情報（随意契約の締結状況・発注予定）も収録しています。

  出典：東京都オープンデータカタログ（東京都・都内区市町村）。Queria が加工したものです。
keywords:
  - 東京都
  - 子育て
  - 保育所
  - 児童館
  - 施設
  - GIS
  - カタログ
  - メタデータ
  - 人口
  - 世帯
  - 外国人
  - 賃金
  - 賞与
  - 労働時間
  - パートタイム
  - 雇用
  - 入職率
  - 離職率
  - 賃金指数
  - 実質賃金
  - 食品衛生
  - 営業許可
  - 飲食店
  - 生活衛生
  - 調達
  - 随意契約
  - 発注予定
  - 入札
homepage: https://github.com/queria-io/dataset-metro-tokyo
language: ja
