spatial_coverage: [JP]
update_frequency: monthly
cover: 🗼

ai_context:
  instructions: |
    東京都と都内区市町村のオープンデータを横断で引くのに使う。3つのスキーマは性格が違う。
    catalog はカタログ台帳（データセット9646件・提供組織98）で、東京都のポータルに
    何が登録されているかのメタデータ。データの中身ではない。
    リソースの URL はファイル更新で変わるので、常にこの表の最新 URL を見る。
    ods は区市町村が公開する自治体標準オープンデータセットを種別ごとに横断統合したもの。
    **公開している自治体は種別ごとに一部だけ**で、全62区市町村が揃っているわけではない。
    どの自治体が入っているかは ods.source_files（取り込みの実行結果・753行）で確認できる。
    件数を自治体間で比べるときは、まず収録の有無を確認する。
    childcare は東京都福祉局の認可保育所・児童館で、こちらは都全域。
    stats は東京都総務局統計部が公表する統計で、resident_population は
    2001年1月からの月次人口・世帯数。都が全区市町村分をまとめて出しているため
    収録の欠けが無く、区市町村を横に比べたり長期の推移を見るのはこちらを使う。
    ods.population は自治体が個別に公開する年齢別人口で、年齢階級が要るときだけ使う。
    resident_population は集計行（総数・区部・市部など）を含むので、区市町村だけなら
    area_type = '区市町村' で絞る。外国人人口と世帯数は2012年7月分と8月分の間に
    制度変更の段差がある。
    元データの値は補正せず原典のまま入れている。lat / lon は自治体が公開した生値で、
    緯度と経度が入れ替わったまま公開されている自治体（ods.cultural_property の豊島区、
    ods.public_wireless_lan の世田谷区など）や、経度の小数点が欠落している行がある。
    **地図に出すときは lat / lon ではなく geo_lat / geo_lon / geometry を使う。**
    これは Queria が付与した列で、値域に収まらない座標を落とし、緯度と経度が
    入れ替わっている行は入れ替えて採用してある。さらに、原典に使える座標が無い行は
    住所を ABR（アドレス・ベース・レジストリ）でジオコーディングして補ってある。
    採用した値の由来は geo_source（source / source_swapped / abr）、粒度は geo_level
    で引ける。ABR 由来の粒度は residential_detail（住居番号）/ residential_block（街区）/
    machiaza_detail（丁目）/ machiaza（町字）。市区町村の代表点は採用していない。
    geometry は geo_lat / geo_lon から作った POINT で、座標の無い行は NULL。
    日付は自治体ごとに表記が違うため DATE に正規化しているが、「4月頃」のような
    自由記述は推測せず NULL にしている。
    標準列にマッピングできない自治体独自の列は extras（JSON）に退避してある。
    ods.school_district は施設一覧ではなく学校×通学区域で、所在地・緯度経度を持たない。
    介護事業所を全国で見るなら mhlw.kaigo.establishment、学校の位置は nlftp.facility.school。
  synonyms: [東京都オープンデータ, 自治体標準オープンデータセット, ODS, CKAN, 区市町村]
  examples:
    - 区市町村別のAED設置数を出したい
    - 保育所を地図に出して定員で色分けしたい
    - 東京都のカタログにどんなデータセットがあるか探したい

schemas:
  - name: catalog
    title: カタログ
  - name: childcare
    title: 子育て施設
  - name: ods
    title: 自治体標準データセット
  - name: stats
    title: 都の統計
