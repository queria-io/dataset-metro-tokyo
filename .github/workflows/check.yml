name: Check

on:
  pull_request:
    paths:
      - "pipelines/**"
      # tests/pipelines は dbt マクロ本体の SQL も読んで確かめる
      - "macros/**"
      - "tests/pipelines/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/check.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # pipelines は shared（submodule）の取得部品を import する
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # dev は default-groups から外してあるので明示的に入れる
      - run: uv run --group dev pytest tests/pipelines -q
